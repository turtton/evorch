name: ci

on:
  push:
    branches:
      - main
  pull_request:

# 同一 ref への連続 push / PR 更新で古い実行を中断し、runner を無駄遣いしないようにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Aggregate gate, usable as a required check: it succeeds only when every job
  # it needs succeeded and the per-group test inventories add up to the whole
  # workspace test set (scripts/verify-test-inventory.sh). main has no required
  # checks configured today.
  ci:
    if: always()
    needs: [quick-checks, lint, docs-schema, otel, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key' | tr '\n' ' ')
          if [ -n "$bad" ]; then
            echo "::error::jobs that did not succeed: $bad"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-inventory-*
          path: inventories
      - name: Merge the test inventories of every group and shard
        run: scripts/verify-test-inventory.sh --expected-sha "$GITHUB_SHA" inventories

  # Cheap checks that need no compilation of the workspace.
  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Claude compatibility skill offline tools
        run: node --test .agents/skills/claude-code-compatibility/scripts/inspect-client-hello.test.mjs
      # The DOM-free half of the web workbench unit tests; the browser-e2e job
      # runs all of them in Chromium. The assets are plain .js ES modules, which
      # Node before 22.7 only detects as modules with this flag.
      - name: Web workbench JavaScript unit tests
        run: node --experimental-detect-module crates/workbench-web/tests/web/run-node.mjs
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt
      - run: cargo fmt --all --check
      # scripts/setup-cef.sh (CI) and flake.nix (Nix) must fetch the CEF build
      # that Cargo.lock binds.
      - name: CEF pin consistency
        run: scripts/tests/test_setup_cef_pin.sh
      # The cached CEF extraction is only used when it matches the pinned digest,
      # and the evidence matrix must fail when any capture fails.
      - name: CEF cache digest and GUI evidence matrix scripts
        run: |
          scripts/tests/test_cef_tree_digest.sh
          scripts/tests/test_gui_evidence_matrix.sh
      # ADR 0045 §11: workbench-protocol stays free of workspace crates and
      # workbench-client depends only on it. gui and evorch may not gain
      # workspace dependencies beyond scripts/workbench-boundary-allowlist.txt.
      # Reads `cargo metadata`; needs jq, which the ubuntu-latest image provides.
      - name: Workbench crate boundaries
        run: |
          scripts/tests/test_check_workbench_boundaries.sh
          scripts/check-workbench-boundaries.sh
      # Every workspace member is in exactly one test group, and the merge gate
      # of the group inventories rejects what it should.
      - name: Test group definition and inventory merge gate
        run: |
          scripts/tests/test_verify_test_inventory.sh
          scripts/verify-test-inventory.sh --check-config
      # The cached .debs of apt-install are only installed after they verify against
      # the runner's Ubuntu archive keyring, and its failure paths (dpkg, apt-get,
      # an unverified cache, what may be saved) behave as documented.
      - name: apt-install cache verification and install paths
        run: |
          scripts/tests/test_apt_verify_cache.sh
          scripts/tests/test_apt_install.sh

  # Whole-workspace lint. `gui` enables CEF by default, so the build links
  # libcef.so (setup-cef); nothing here starts CEF.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      - uses: ./.github/actions/setup-cef
      # One dependency cache serves lint, docs-schema, otel and every test group:
      # only the cache-save job writes it (main pushes), this job restores it.
      # The cache action caches target/ recursively, which includes
      # CARGO_TARGET_DIR below; keep that variable scoped to Cargo steps.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace
          save-if: false
      - name: Clippy (workspace)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (event-bus with otel-exporter)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: cargo clippy -p event-bus --all-targets --features otel-exporter --locked -- -D warnings
      # gui has no non-CEF build any more.
      - name: GUI refuses to build without CEF
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/tests/test_gui_requires_cef.sh

  # Doctests and the generated config schema artifact: both build the library
  # crates of the whole workspace.
  docs-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      # The doctests of `gui` link libcef.so; none of them starts CEF.
      - uses: ./.github/actions/setup-cef
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace
          save-if: false
      - name: Workspace doctests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        timeout-minutes: 15
        run: cargo test --workspace --doc --locked
      # Config 型を変更したら versioned schema artifact も再生成が必要 (issue #33)。
      - name: Check config schema artifact is up to date
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          cargo run -q --locked -p config --example dump_schema -- docs/config/evorch-config-v3.schema.json
          git diff --exit-code docs/config/evorch-config-v3.schema.json

  # ADR 0023: retain the opt-in OTLP end-to-end coverage.
  otel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace
          save-if: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Event bus otel-exporter tests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: cargo nextest run -p event-bus --features otel-exporter --locked --no-tests fail
      - name: Event bus otel-exporter doctests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        timeout-minutes: 10
        run: cargo test -p event-bus --features otel-exporter --doc --locked

  # The workspace test suite, one job per crate group (scripts/ci-test-groups.json
  # is the single definition; the matrix below repeats its group names and shard
  # counts, and the merge gate in `ci` rejects any drift). A group's shards build
  # the same packages and features and only differ in `--partition hash:K/N`.
  # Inside a group the tests keep their three suites: the cache and storage I/O
  # contracts, then everything else.
  tests:
    name: tests (${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    # Normal runs take a few minutes; a cold dependency cache roughly doubles that.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: runtime, shard: 1, shards: 2, cef: false }
          - { group: runtime, shard: 2, shards: 2, cef: false }
          - { group: gui, shard: 1, shards: 2, cef: true }
          - { group: gui, shard: 2, shards: 2, cef: true }
          - { group: storage-tools, shard: 1, shards: 1, cef: false }
          - { group: support, shard: 1, shards: 1, cef: false }
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # gui/wgpu 系の linking が重いため mold で短縮する。
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
      EVORCH_TEST_INVENTORY_DIR: test-inventory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 2026-10-09 時点の runner は root の空きが約 86G あり、削除 (android だけで
      # 71s) は不要になった。空きが少ない runner でだけ従来どおり削除する。
      - name: Free runner disk space
        run: |
          df -h /
          avail_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$avail_gb" -ge 60 ]; then
            echo "skip cleanup: ${avail_gb}G available"
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Install linker, search, and Claude transport build dependencies
        # crates/tools の grep テストが rg を必要とするが、ubuntu-latest から
        # ripgrep が外れたため明示インストールする (2026-09-11 欠落確認)。
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      # `gui` enables CEF by default, so only the gui group (and lint/docs-schema,
      # which build the whole workspace) links libcef.so. None of the tests starts
      # CEF (the cef-e2e job does), so only a libcef.so link goes on the loader path.
      - uses: ./.github/actions/setup-cef
        if: matrix.cef
      # Restore only: the cache-save job writes the shared dependency cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace
          save-if: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      # Builds the group's test binaries once and lists every test set; the
      # `ci` job merges these listings. The runs below reuse the binaries.
      - name: Build and list the test inventory
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/run-test-group.sh inventory "${{ matrix.group }}" "${{ matrix.shard }}/${{ matrix.shards }}" "$EVORCH_TEST_INVENTORY_DIR"
      # CI enforces cost-sensitive invariants with this offline gate
      # (scripts/check-cache-contracts.sh, called by run-test-group.sh with the
      # group and shard). The mock computes cache usage from received input;
      # compaction has an explicit boundary.
      - name: Cache preservation contracts (offline)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/run-test-group.sh run "${{ matrix.group }}" "${{ matrix.shard }}/${{ matrix.shards }}" cache "$EVORCH_TEST_INVENTORY_DIR"
      # scripts/check-io-contracts.sh, again through run-test-group.sh.
      - name: Storage I/O contracts (offline)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/run-test-group.sh run "${{ matrix.group }}" "${{ matrix.shard }}/${{ matrix.shards }}" io "$EVORCH_TEST_INVENTORY_DIR"
      # nextest owns parallelism and the per-test hang watchdog. Every default
      # non-ignored test belongs to exactly one of the three suites.
      - name: Remaining tests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/run-test-group.sh run "${{ matrix.group }}" "${{ matrix.shard }}/${{ matrix.shards }}" remaining "$EVORCH_TEST_INVENTORY_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-inventory-${{ matrix.group }}-${{ matrix.shard }}
          if-no-files-found: error
          path: ${{ env.EVORCH_TEST_INVENTORY_DIR }}
      # 削除省略の閾値を見直せるよう、ビルド後の使用量を残す。
      - name: Report disk usage
        if: always()
        run: df -h /

  # The only writer of the shared dependency cache (key *-ci-workspace) that
  # lint, docs-schema, otel and the test groups restore. It runs on main pushes
  # only, so it is never on a PR's critical path and PRs never crowd the
  # repository's 10GB cache budget. It compiles every dependency artifact the
  # other jobs need, with each of their own package and feature selections:
  # the workspace check (lint), the doctests and the schema example
  # (docs-schema), the otel-exporter build (otel) and the test binaries of
  # every group in scripts/ci-test-groups.json. It does not run the normal
  # nextest suite (the doctests above do run).
  cache-save:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      - uses: ./.github/actions/setup-cef
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace
          save-if: true
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Build the dependencies of every other job
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          cargo clippy --workspace --all-targets --locked
          cargo clippy -p event-bus --all-targets --features otel-exporter --locked
          cargo test --workspace --doc --locked
          cargo build --locked -p config --example dump_schema
          cargo nextest list -p event-bus --features otel-exporter --locked > /dev/null
          for group in $(jq -r '.groups | keys[]' scripts/ci-test-groups.json); do
            echo "::group::build the test binaries of $group"
            scripts/run-contract-tests.sh --group "$group" --list default > /dev/null
            echo "::endgroup::"
          done
      - name: Report disk usage
        if: always()
        run: |
          df -h /
          du -sh target/ci-shared

  # nix run / nix build が cargo test では拾えない sandbox 固有の失敗
  # (DNS resolver 初期化等) で壊れたまま main に入るのを防ぐ (2026-09-14 事象)。
  #
  # フルビルド (Nix package build) は main への push と、Nix に影響する変更を含む
  # PR だけで走らせる。判定は scripts/nix-build-scope.sh (対象パスと根拠はその
  # 冒頭コメント)。それ以外の PR は、Nix の cargoArgs と同じ -p/--bin 指定の
  # 非テスト構成 cargo check で代替する。ci job は workspace 全体を --all-targets
  # で見るため、dev-dependency が有効化する feature (test-support 等) が混ざり、
  # -p 単位のビルドでだけ出る不具合 (2026-11-09 の TestSeams 事象) を見逃す。
  # この job は PR でも常に走り、成功/失敗を返す (job 自体は skip しない)。
  nix-build:
    runs-on: ubuntu-latest
    # A cold deps build takes ~35-45 min and the attic push step is capped at 60.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The scope check diffs the PR's test merge commit against its first parent.
          fetch-depth: 2
      - name: Decide whether the Nix package build is needed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Only an explicit full=false skips the package build: a script failure
        # fails the step, and a missing output keeps the Nix steps.
        run: |
          set -o pipefail
          scripts/tests/test_nix_build_scope.sh
          scripts/nix-build-scope.sh | tee -a "$GITHUB_OUTPUT"
      # Pull requests without Nix-affecting changes run this instead of the
      # package build. The toolchain comes from the rust-toolchain action (the
      # nix dev shell would need tailscale, nix and an attic fetch first) and
      # the dependencies from a rust-cache that pushes to main save. main runs
      # it too, ahead of the package build, to keep that cache current.
      - name: Install linker and Claude transport build dependencies
        if: steps.scope.outputs.full == 'false' || github.ref == 'refs/heads/main'
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold cmake clang libclang-dev ninja-build perl git
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.scope.outputs.full == 'false' || github.ref == 'refs/heads/main'
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.full == 'false' || github.ref == 'refs/heads/main'
        with:
          shared-key: ${{ runner.os }}-nix-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The packages and binaries of shippedCargoArgs in flake.nix (x86_64-linux),
      # release profile, no tests: the Nix package's build minus code generation.
      # Keep the two in step.
      - name: Check the shipped binaries without test configuration
        if: steps.scope.outputs.full == 'false' || github.ref == 'refs/heads/main'
        timeout-minutes: 30
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
        run: cargo check --locked --release -p evorch -p evorch-core --bin evorch --bin evorch-core
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        if: steps.scope.outputs.full != 'false'
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: steps.scope.outputs.full != 'false'
      - name: Setup attic client
        if: steps.scope.outputs.full != 'false'
        run: |
          nix run --inputs-from . nixpkgs#attic-client -- login --set-default home https://attic.taile2777.ts.net "$ATTIC_TOKEN"
          nix run --inputs-from . nixpkgs#attic-client -- use home
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      - name: Build patched attic client
        if: steps.scope.outputs.full != 'false'
        run: |
          # Build on PRs too so changes to the upload timeout patch are checked.
          nix build -L .#attic-client --out-link ./result-attic
      - name: Build CLI dependencies
        if: steps.scope.outputs.full != 'false'
        run: nix build -L .#evorch-deps --out-link ./result-deps
      - name: Cache PR CLI dependencies in attic
        if: steps.scope.outputs.full != 'false' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # Cache completed deps before later builds can fail or be cancelled.
          if ! ATTIC_PUSH_ATTEMPTS=1 ATTIC_PUSH_TIMEOUT=290s scripts/push-attic.sh ./result-deps; then
            echo "::warning::PR CLI dependency upload failed or timed out; continuing the build"
          fi
      - name: Build CEF dependencies
        if: steps.scope.outputs.full != 'false'
        run: nix build -L .#evorch-gui-cef-deps --out-link ./result-cef-deps
      - name: Cache PR CEF dependencies in attic
        if: steps.scope.outputs.full != 'false' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! ATTIC_PUSH_ATTEMPTS=1 ATTIC_PUSH_TIMEOUT=290s scripts/push-attic.sh ./result-cef-deps; then
            echo "::warning::PR CEF dependency upload failed or timed out; continuing the build"
          fi
      # The default package is the CLI from .#evorch plus the CEF GUI on
      # x86_64-linux (ADR 0034), so one build runs both install checks (CLI
      # startup, ELF linkage after runtime fixup, the CEF layout). .#evorch
      # builds no non-CEF GUI there, and its closure is part of the default
      # package's, so the attic push below covers it.
      - name: Build and smoke-test flake package in the Nix sandbox
        if: steps.scope.outputs.full != 'false'
        run: nix build -L .#default --out-link ./result-default
      - name: Push to attic
        if: steps.scope.outputs.full != 'false' && success() && github.ref == 'refs/heads/main'
        timeout-minutes: 60
        run: |
          # How the runner reaches attic (direct or DERP relay) bounds throughput.
          timeout 60 sudo tailscale ping -c 3 attic.taile2777.ts.net || true
          scripts/push-attic.sh ./result-attic ./result-default ./result-deps ./result-cef-deps

  # v0.1: offscreen 描画検証。wgpu の software Vulkan (lavapipe) で実 render し、
  # ignored の GUI テストを実行する（ADR 0009 / issue #9 の受理基準）。
  # 証跡マトリクスと native/Wayland 検査は並列の gui-evidence job が担う。
  offscreen-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      # The shared dependency cache of the ci jobs (written by cache-save on main
      # pushes). Its key hashes the job-level CARGO_* / RUSTFLAGS env, so this job
      # sets exactly cache-save's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace
          save-if: false
      # The Azure Ubuntu mirror once served packages at tens of kB/s for over an
      # hour (2026-10-23). The action caches the .debs per package set and runner
      # image, and a verified cache installs without reaching any mirror.
      - name: Install headless rendering and isolated X11/Wayland deps
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libglx-mesa0 mold xvfb openbox xdotool imagemagick jq weston libx11-6 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0 cmake clang libclang-dev ninja-build perl git
      # Only a libcef.so link: the distribution's own Vulkan loader would shadow
      # the system one the lavapipe renders below go through.
      - uses: ./.github/actions/setup-cef
      - name: Prepare evidence directories
        run: mkdir -p target/gui-evidence/model-metadata /tmp/opencode
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      # The ignored html_preview tests start a real CEF; the cef-e2e job runs them.
      - name: Run all ignored GUI tests (required real render)
        # Selects the packages and features of the gui test group, which cache-save
        # builds (scripts/ci-test-groups.json): rust-cache only reuses dependency
        # artifacts whose feature resolution matches, and `-p gui` alone resolves
        # differently. The filter keeps the gui package's tests that the earlier
        # `-p gui --tests` run selected.
        run: |
          sel=$(jq -r '.groups.gui | [(.packages[] | "-p " + .), (.features[]? | "-F " + .)] | join(" ")' scripts/ci-test-groups.json)
          cargo nextest run --locked $sel --test-threads 1 --run-ignored only -E 'package(=gui) & not (kind(lib) & test(/^html_preview::tests::/))' --success-output immediate --no-tests fail
        env:
          CARGO_TARGET_DIR: target/ci-shared
          EVORCH_REQUIRE_ADAPTER: "1"
          # Cargo runs tests from the crate directory, not the workspace root.
          EVORCH_METADATA_EVIDENCE: ${{ github.workspace }}/target/gui-evidence/model-metadata
          WGPU_BACKEND: vulkan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gui-test-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            target/gui-evidence
            .opencode/v04-captures
            /tmp/opencode/*.png

  # The evidence matrix (3 themes x 40 PNGs), the native Xvfb check and the
  # Wayland idle check. headless_capture and native_qa_window are built once and
  # started directly, so this job needs the gui library but none of the test
  # binaries that offscreen-gate builds.
  gui-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The same job-level env as cache-save: rust-cache hashes CARGO_* and RUSTFLAGS
    # into its key, so a different set restores nothing. CARGO_TARGET_DIR is set on
    # the steps that run cargo only.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      # The shared dependency cache of the ci jobs (written by cache-save on main
      # pushes). Its key hashes the job-level CARGO_* / RUSTFLAGS env, so this job
      # sets exactly cache-save's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace
          save-if: false
      # The Azure Ubuntu mirror once served packages at tens of kB/s for over an
      # hour (2026-10-23). The action caches the .debs per package set and runner
      # image, and a verified cache installs without reaching any mirror.
      - name: Install headless rendering and isolated X11/Wayland deps
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libglx-mesa0 mold xvfb openbox xdotool imagemagick jq weston libx11-6 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0 cmake clang libclang-dev ninja-build perl git
      # Only a libcef.so link: the distribution's own Vulkan loader would shadow
      # the system one the lavapipe renders below go through.
      - uses: ./.github/actions/setup-cef
      - name: Prepare evidence directories
        run: mkdir -p target/gui-evidence
      - name: Build the evidence binaries
        env:
          CARGO_TARGET_DIR: target/ci-shared
        # Same selection as offscreen-gate, for the same cache reason. Naming one
        # small integration test makes Cargo resolve features with the dev
        # dependencies, as the gui group's test build does, without building every
        # test binary.
        run: |
          sel=$(jq -r '.groups.gui | [(.packages[] | "-p " + .), (.features[]? | "-F " + .)] | join(" ")' scripts/ci-test-groups.json)
          cargo build --locked $sel --bin headless_capture --bin native_qa_window --test evidence_policy
      - name: Capture size and DPI evidence matrix
        run: scripts/gui-evidence-matrix.sh
        env:
          HEADLESS_CAPTURE_BIN: ${{ github.workspace }}/target/ci-shared/debug/headless_capture
          WGPU_BACKEND: vulkan
      - name: Exercise native GUI in a private Xvfb
        run: scripts/check-gui-native.sh target/gui-evidence/native
        env:
          GUI_BIN: ${{ github.workspace }}/target/ci-shared/debug/native_qa_window
      - name: Check Wayland redraw wait and idle budgets in a private Weston
        run: scripts/check-gui-wayland-idle.sh target/gui-evidence/wayland-idle
        env:
          GUI_BIN: ${{ github.workspace }}/target/ci-shared/debug/native_qa_window
      - name: Prepare representative PR screenshots
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p target/gui-pr-preview
          cp 'target/gui-evidence/graphite/demo-1280x720@1.0.png' target/gui-pr-preview/01-workbench.png
          cp 'target/gui-evidence/graphite/panel-agent-main-1280x720@1.0.png' target/gui-pr-preview/02-conversation.png
          cp 'target/gui-evidence/graphite/panel-tasks-main-1280x720@1.0.png' target/gui-pr-preview/03-tasks.png
          cp 'target/gui-evidence/graphite/modal-provider-1280x720@1.0.png' target/gui-pr-preview/04-provider-settings.png
          cp 'target/gui-evidence/graphite/pending-approvals-1280x720@1.0.png' target/gui-pr-preview/05-approvals.png
          cp 'target/gui-evidence/high-contrast/demo-1280x720@1.0.png' target/gui-pr-preview/06-high-contrast.png
          jq -n --argjson pr "$PR_NUMBER" --arg sha "$PR_HEAD_SHA" --argjson run "$GITHUB_RUN_ID" \
            '{pr: $pr, head_sha: $sha, run_id: $run}' > target/gui-pr-preview/pr.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'pull_request'
        with:
          name: gui-pr-preview
          if-no-files-found: error
          path: target/gui-pr-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gui-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: target/gui-evidence

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-cargo
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold cmake clang libclang-dev ninja-build perl git
      - name: Locate Chrome/Chromium executable
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Run agent browser test
        run: cargo nextest run -p browser --test agent_chromium --run-ignored only --success-output immediate --no-tests fail
      - name: Run web workbench browser test
        env:
          WORKBENCH_WEB_SCREENSHOT_DIR: ${{ github.workspace }}/target/web-ui-screenshots
        run: cargo nextest run -p workbench-web --test web_ui_chromium --run-ignored only --success-output immediate --no-tests fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-ui-screenshots
          if-no-files-found: warn
          path: target/web-ui-screenshots

  # ADR 0034 B: the real CEF HTML preview. setup-cef installs the pinned
  # distribution (scripts/setup-cef.sh) that every job's build now links; this
  # job also starts it. The lint of the CEF feature is the workspace clippy in
  # the lint job, which builds gui with its default features.
  cef-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-cef
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold cmake clang libclang-dev ninja-build perl git
      # CEF reads its resources beside the libcef.so it was loaded from.
      - uses: ./.github/actions/setup-cef
        with:
          runtime-path: full
      # Chromium's sandbox needs unprivileged user namespaces; the SUID
      # chrome-sandbox is never used (ADR 0034).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: CEF offline isolation and crash recovery
        run: cargo nextest run -p browser-cef --features cef --run-ignored all --success-output immediate --no-tests fail
      - name: Card snapshots and agent artifact inspection through CEF
        run: |
          export EVORCH_CEF_HELPER="$PWD/target/debug/evorch-cef-helper"
          cargo build -p browser-cef --features cef --bin evorch-cef-helper
          cargo nextest run -p gui --lib -E 'test(/^html_preview::tests::/)' --run-ignored only --success-output immediate --no-tests fail
