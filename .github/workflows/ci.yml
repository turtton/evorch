name: ci

on:
  push:
    branches:
      - main
  pull_request:

# 同一 PR への連続 push / 更新では古い実行を中断し、runner を無駄遣いしないようにする。
# main の実行は後続 push で中断しない: cache-save (共有依存 cache の唯一の writer)
# が保存まで進めるようにするため。待機中の run が後続の run に置き換わることは
# 残る (すべての main push が実行される保証ではない)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Aggregate gate, usable as a required check: it succeeds only when every job
  # it needs succeeded and the per-group test inventories add up to the whole
  # workspace test set (scripts/verify-test-inventory.sh). main has no required
  # checks configured today.
  ci:
    if: always()
    needs: [quick-checks, scope-gate, lint, docs-schema, otel, product-artifact, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key' | tr '\n' ' ')
          if [ -n "$bad" ]; then
            echo "::error::jobs that did not succeed: $bad"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-inventory-*
          path: inventories
      - name: Merge the test inventories of every group and shard
        run: scripts/verify-test-inventory.sh --expected-sha "$GITHUB_SHA" inventories

  # A feature PR of the single-core migration changes only the files of its scope;
  # only an integration PR changes the central files (scripts/central-files.txt).
  # The scope is the head branch name, see scripts/ci-scope-gate.sh. The full
  # history is fetched so that the merge base with the target branch exists.
  scope-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Files of the PR against its scope
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/ci-scope-gate.sh --head-ref "$HEAD_REF" --base "origin/$BASE_REF"

  # Cheap checks that need no compilation of the workspace.
  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Claude compatibility skill offline tools
        run: node --test .agents/skills/claude-code-compatibility/scripts/inspect-client-hello.test.mjs
      # The DOM-free half of the web workbench unit tests; the browser-e2e job
      # runs all of them in Chromium. The assets are plain .js ES modules, which
      # Node before 22.7 only detects as modules with this flag.
      - name: Web workbench JavaScript unit tests
        run: node --experimental-detect-module crates/workbench-web/tests/web/run-node.mjs
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt
      - run: cargo fmt --all --check
      # scripts/setup-cef.sh (CI) and flake.nix (Nix) must fetch the CEF build
      # that Cargo.lock binds.
      - name: CEF pin consistency
        run: scripts/tests/test_setup_cef_pin.sh
      # The cached CEF extraction is only used when it matches the pinned digest,
      # and the evidence matrix must fail when any capture fails.
      - name: CEF cache digest and GUI evidence matrix scripts
        run: |
          scripts/tests/test_cef_tree_digest.sh
          scripts/tests/test_gui_evidence_matrix.sh
      # ADR 0045 §11: workbench-protocol stays free of workspace crates and
      # workbench-client depends only on it. gui and evorch may not gain
      # workspace dependencies beyond scripts/workbench-boundary-allowlist.txt.
      # Reads `cargo metadata`; needs jq, which the ubuntu-latest image provides.
      - name: Workbench crate boundaries
        run: |
          scripts/tests/test_check_workbench_boundaries.sh
          scripts/check-workbench-boundaries.sh
      # Central files of the single-core migration (scripts/central-files.txt)
      # change only in integration PRs; feature PRs are checked against their
      # scope with `scripts/check-central-files.sh --scope <pr>`. The core-client
      # desktop gains no reference to internal crates beyond its baseline.
      - name: Central files and core-client references
        run: |
          scripts/tests/test_check_central_files.sh
          scripts/check-central-files.sh --check-data
          bash scripts/tests/test_check_admin_publish_boundary.sh
          bash scripts/check-admin-publish-boundary.sh
          bash scripts/tests/test_check_q2_boundaries.sh
          bash scripts/check-q2-boundaries.sh
          scripts/check-core-client-refs.sh
      # The sealed product artifact (scripts/product-artifact.sh) accepts only the
      # distribution's build and refuses a changed, featured or unsealed copy.
      - name: Product artifact sealing
        run: scripts/tests/test_product_artifact.sh
      # The helper's dependency graph (cargo tree --locked, normal and build edges,
      # every target) must equal the receipt in crates/process-guard/Cargo.toml: a
      # dependency change otherwise leaves the compat identity of the delivered
      # helper unchanged.
      - name: Process guard dependency receipt
        run: scripts/guard-artifact.sh check-dependencies
      # Every workspace member is in exactly one test group, and the merge gate
      # of the group inventories rejects what it should.
      - name: Test group definition and inventory merge gate
        run: |
          scripts/tests/test_verify_test_inventory.sh
          scripts/verify-test-inventory.sh --check-config
      # The former GUI integration tests that only a main push runs
      # (scripts/ci-main-only-gui-tests.json): the registry is well formed and names
      # integration tests of the gui package. That none of their sources names the
      # core-client desktop is checked where the binaries are built, from the
      # compiler's dependency-info, in the gui group's inventory step below
      # (scripts/run-test-group.sh). Reads `cargo metadata`; builds nothing.
      - name: Main-only GUI registry
        run: |
          scripts/tests/test_ci_main_only_gui.sh
          scripts/tests/test_run_contract_tests.sh
          scripts/ci-main-only-gui.sh validate
      - name: Harness runner and doctest coverage
        run: python3 scripts/tests/test_check_harness.py
      # The consumer side of the product artifact: the wait for the producer job
      # (mock GitHub API, virtual clock, no network) and how the consumer jobs and
      # the tests matrix are wired to it and to scripts/ci-test-groups.json.
      - name: Product artifact wait and CI workflow configuration
        run: |
          scripts/tests/test_wait_product_artifact.sh
          scripts/tests/test_ci_workflow_config.sh
      # The flaky/hang reproduction wrapper, against mock systemd-run/systemctl
      # (no load, no systemd needed): argument passthrough, --repeat, start
      # failures, name collisions, timeout and interruption.
      - name: Reproduction wrapper regression tests
        run: scripts/tests/test_reproduce_under_limits.sh
      # The cached .debs of apt-install are only installed after they verify against
      # the runner's Ubuntu archive keyring, and its failure paths (dpkg, apt-get,
      # an unverified cache, what may be saved) behave as documented.
      - name: apt-install cache verification and install paths
        run: |
          scripts/tests/test_apt_verify_cache.sh
          scripts/tests/test_apt_install.sh

  # Whole-workspace lint. `gui` enables CEF by default, so the build links
  # libcef.so (setup-cef); nothing here starts CEF.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      - uses: ./.github/actions/setup-cef
      # One dependency cache serves lint, docs-schema, otel and every test group:
      # only the cache-save job writes it (main pushes), this job restores it.
      # The cache action caches target/ recursively, which includes
      # CARGO_TARGET_DIR below; keep that variable scoped to Cargo steps.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace-v2
          save-if: false
      - name: Clippy (workspace)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (core handoff fixtures)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: cargo clippy -p core-instance -p core-launcher --all-targets --features core-instance/recovery-test-support,core-launcher/handoff-test-support --locked -- -D warnings
      - name: Clippy (event-bus with otel-exporter)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: cargo clippy -p event-bus --all-targets --features otel-exporter --locked -- -D warnings
      # gui has no non-CEF build any more.
      - name: GUI refuses to build without CEF
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/tests/test_gui_requires_cef.sh
      - name: Non-Linux sandbox adapter compiles (aarch64-apple-darwin)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --target aarch64-apple-darwin -p sandbox --lib --locked

  # Doctests and the generated config schema artifact: both build the library
  # crates of the whole workspace.
  docs-schema:
    # Starts after the producer instead of next to it: this job only needs the
    # product for its doctests, and a runner that waits for the producer for minutes
    # counts against the repository's concurrent-job budget while it does nothing.
    needs: product-artifact
    # The artifact wait reads this run's jobs (actions: read); nothing else is
    # granted. The workflow has no top-level permissions.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      # The doctests of `gui` link libcef.so; none of them starts CEF.
      - uses: ./.github/actions/setup-cef
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace-v2
          save-if: false
      # The doctests start owned children through the library policy: the helper
      # bundle of the sealed product reaches them as EVORCH_PROCESS_GUARD_BUNDLE.
      # `needs: product-artifact` makes the producer's success a precondition, so
      # the wait returns at once; it stays as the same check every consumer makes
      # (this run's producer job succeeded, exactly one artifact), then: take this
      # run's artifact, check it was built from this commit, then verify and install
      # it. Nothing that runs a product test or a product binary comes before this.
      - name: Wait for the product artifact job
        timeout-minutes: 31
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/wait-product-artifact.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: product-core
          path: ${{ runner.temp }}/product-download
      - name: Check the product artifact was built from this commit
        run: scripts/wait-product-artifact.sh check-source "$RUNNER_TEMP/product-download"
      - name: Install the sealed product artifact
        run: scripts/product-artifact.sh install "$RUNNER_TEMP/product-download" "$RUNNER_TEMP/evorch-product" >> "$GITHUB_ENV"
      # workbench-authority is excluded: other packages' dev-dependencies enable its
      # `test-support` feature, and the workspace-wide feature union would then compile
      # its compile-fail doctests against the fake verifier. The authority's doctests
      # run alone, below, with its default features only.
      - name: Workspace doctests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        timeout-minutes: 15
        run: cargo test --workspace --exclude workbench-authority --doc --locked
      # 5a-I: the compile-fail doctests of the authority (no literal, serde or public
      # constructor of a verified proof). One invocation of this package alone, so no
      # dev-dependency feature of another package is unified into it. Every
      # dependency was fetched by the step above.
      - name: Authority compile-fail doctests
        env:
          CARGO_TARGET_DIR: target/ci-shared
          CARGO_BUILD_GC_ENABLED: "false"
        timeout-minutes: 15
        run: cargo test --offline --locked -p workbench-authority --doc --no-default-features
      # Config 型を変更したら versioned schema artifact も再生成が必要 (issue #33)。
      - name: Check config schema artifact is up to date
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          cargo run -q --locked -p config --example dump_schema -- docs/config/evorch-config-v3.schema.json
          git diff --exit-code docs/config/evorch-config-v3.schema.json

  # ADR 0023: retain the opt-in OTLP end-to-end coverage.
  otel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace-v2
          save-if: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Event bus otel-exporter tests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: cargo nextest run -p event-bus --features otel-exporter --locked --no-tests fail
      - name: Event bus otel-exporter doctests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        timeout-minutes: 10
        run: cargo test -p event-bus --features otel-exporter --doc --locked

  # The shipped evorch-core and the process-guard helper, built together apart from
  # every test build with the arguments of the distribution (flake.nix
  # `evorch-core`: `-p evorch-core -p process-guard --bin evorch-core --bin
  # evorch-process-guard`, release profile, no feature). scripts/product-artifact.sh
  # seals an immutable closure (core, helper, guard-bundle.json, manifest); every
  # job that runs a test or a product binary downloads that copy and reads it
  # through EVORCH_PRODUCT_CORE_EXE / EVORCH_PRODUCT_MANIFEST and
  # EVORCH_PROCESS_GUARD_BUNDLE (crates/test-support/src/product_artifact.rs).
  # A test build never touches it.
  product-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold cmake clang libclang-dev ninja-build perl git
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-product
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and seal the product artifact
        run: |
          started=$SECONDS
          scripts/product-artifact.sh build "$RUNNER_TEMP/evorch-product" > /dev/null
          {
            echo "### Product artifact"
            echo
            echo "build and seal: $((SECONDS - started)) s"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/evorch-product/product-manifest.json"
            echo '```'
            if [ -f "$RUNNER_TEMP/evorch-product/guard-bundle.json" ]; then
              echo
              echo '```json'
              cat "$RUNNER_TEMP/evorch-product/guard-bundle.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guard artifact regression and mutation tests
        run: EVORCH_PROCESS_GUARD_BUNDLE="$RUNNER_TEMP/evorch-product/guard-bundle.json" scripts/tests/test_guard_artifact.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-core
          # A re-run of a failed producer replaces an older same-name artifact
          # instead of leaving two for the consumers to pick from.
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/evorch-product

  # The workspace test suite, one job per crate group (scripts/ci-test-groups.json
  # is the single definition; the matrix below repeats its group names and shard
  # counts, and the merge gate in `ci` rejects any drift). A group's shards build
  # the same packages and features and only differ in `--partition hash:K/N`.
  # Inside a group the tests keep their suites: the cache and storage I/O
  # contracts, then everything else (`ci-remaining`). The one suite that only a
  # main push runs is `main-only-gui`: the gui integration tests that
  # scripts/ci-main-only-gui-tests.json registers, a former embedded GUI check.
  # Every event lists and partitions the same suites (the merge gate in `ci`
  # checks them); only the run step of `main-only-gui` depends on the event.
  tests:
    name: tests (${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: scope-gate
    # The artifact wait reads this run's jobs (actions: read); nothing else is
    # granted. The workflow has no top-level permissions.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    # Normal runs take a few minutes; a cold dependency cache roughly doubles that.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: runtime, shard: 1, shards: 4, cef: false }
          - { group: runtime, shard: 2, shards: 4, cef: false }
          - { group: runtime, shard: 3, shards: 4, cef: false }
          - { group: runtime, shard: 4, shards: 4, cef: false }
          - { group: gui, shard: 1, shards: 1, cef: true }
          - { group: storage-tools, shard: 1, shards: 2, cef: false }
          - { group: storage-tools, shard: 2, shards: 2, cef: false }
          - { group: support, shard: 1, shards: 1, cef: false }
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # gui/wgpu 系の linking が重いため mold で短縮する。
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
      EVORCH_TEST_INVENTORY_DIR: test-inventory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 2026-10-09 時点の runner は root の空きが約 86G あり、削除 (android だけで
      # 71s) は不要になった。空きが少ない runner でだけ従来どおり削除する。
      - name: Free runner disk space
        run: |
          df -h /
          avail_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$avail_gb" -ge 60 ]; then
            echo "skip cleanup: ${avail_gb}G available"
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Install linker, search, and Claude transport build dependencies
        # crates/tools の grep テストが rg を必要とするが、ubuntu-latest から
        # ripgrep が外れたため明示インストールする (2026-09-11 欠落確認)。
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          # strace: the process-guard lifecycle cells need it, and they run in
          # the support and runtime groups.
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git${{ (matrix.group == 'support' || matrix.group == 'runtime') && ' strace' || '' }}${{ matrix.group == 'runtime' && ' bubblewrap' || '' }}
      # `gui` enables CEF by default, so only the gui group (and lint/docs-schema,
      # which build the whole workspace) links libcef.so. None of the tests starts
      # CEF (the cef-e2e job does), so only a libcef.so link goes on the loader path.
      - uses: ./.github/actions/setup-cef
        if: matrix.cef
      # Restore only: the cache-save job writes the shared dependency cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace-v2
          save-if: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Prepare real caller SIGKILL matrix dependencies
        if: matrix.group == 'runtime'
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          timeout -k 5s 20s strace -f -qq -e trace=process -o "$RUNNER_TEMP/ptrace-check" true
          test -s "$RUNNER_TEMP/ptrace-check"
          test -c /dev/ptmx
          cargo build --locked -p evorch --bin evorch
          echo "EVORCH_B3_CLI_EXE=$PWD/target/ci-shared/debug/evorch" >> "$GITHUB_ENV"
          echo "EVORCH_B3_BWRAP_EXE=$(command -v bwrap)" >> "$GITHUB_ENV"
          echo "EVORCH_B3_EVIDENCE_DIR=$RUNNER_TEMP/core-sigkill" >> "$GITHUB_ENV"
      # Builds the group's test binaries once and lists every test set; the
      # `ci` job merges these listings. The runs below reuse the binaries. Listing
      # starts no product, so it comes before the product artifact is awaited.
      - name: Build and list the test inventory
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          scripts/run-test-group.sh inventory "${{ matrix.group }}" "${{ matrix.shard }}/${{ matrix.shards }}" "$EVORCH_TEST_INVENTORY_DIR"
          if [[ "${{ matrix.group }}" == runtime ]]; then
            source scripts/contract-test-filters.sh
            check_planned_shutdown_watchdog_inventory "$EVORCH_TEST_INVENTORY_DIR"
            check_public_restart_contracts_inventory "$EVORCH_TEST_INVENTORY_DIR"
          fi
      # Every group receives the sealed product closure: the helper bundle it carries
      # is what the test binaries are bound to (scripts/guard-cargo.sh), and the
      # groups that run product tests (the evorch-core placeholders and, later, the
      # real tests, including the f4_product_cache and agent_observation_cache cache
      # binaries of the gate below) read the core from it too. Which tests a group
      # selects does not depend on it.
      # The product artifact job runs beside this job (no `needs`): wait for its
      # success, take this run's artifact, check it was built from this commit,
      # then verify and install it. Nothing that runs a product test or a product
      # binary comes before this.
      - name: Wait for the product artifact job
        timeout-minutes: 31
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/wait-product-artifact.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: product-core
          path: ${{ runner.temp }}/product-download
      - name: Check the product artifact was built from this commit
        run: scripts/wait-product-artifact.sh check-source "$RUNNER_TEMP/product-download"
      - name: Install the sealed product artifact
        run: scripts/product-artifact.sh install "$RUNNER_TEMP/product-download" "$RUNNER_TEMP/evorch-product" >> "$GITHUB_ENV"
      # CI enforces cost-sensitive invariants with this offline gate
      # (scripts/check-cache-contracts.sh, called by run-test-group.sh with the
      # group and shard). The mock computes cache usage from received input;
      # compaction has an explicit boundary.
      - name: Cache preservation contracts (offline)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/run-test-group.sh run "${{ matrix.group }}" "${{ matrix.shard }}/${{ matrix.shards }}" cache "$EVORCH_TEST_INVENTORY_DIR"
      # scripts/check-io-contracts.sh, again through run-test-group.sh.
      - name: Storage I/O contracts (offline)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/run-test-group.sh run "${{ matrix.group }}" "${{ matrix.shard }}/${{ matrix.shards }}" io "$EVORCH_TEST_INVENTORY_DIR"
      # nextest owns parallelism and the per-test hang watchdog. Every default
      # non-ignored test belongs to exactly one of cache, io, ci-remaining and
      # main-only-gui.
      # Opt-in process harness: Linux only, not part of the default inventory.
      # The targeted second run fails if the fixture tests disappear entirely.
      # Built, bound to the helper and run from one nextest metadata
      # (scripts/guard-cargo.sh), like every other run of this job.
      - name: Core exec handoff and recovery proof fixtures
        if: matrix.group == 'support'
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          scripts/guard-cargo.sh run -p core-instance --features recovery-test-support --locked --no-tests fail
          scripts/guard-cargo.sh run -p core-launcher --test handoff --test preflight_regression --features handoff-test-support,core-instance/recovery-test-support --locked --no-tests fail
      - name: Remaining tests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/run-test-group.sh run "${{ matrix.group }}" "${{ matrix.shard }}/${{ matrix.shards }}" ci-remaining "$EVORCH_TEST_INVENTORY_DIR"
      # B3-07: real ten-second planned-shutdown expiry (exit 74 and reaping of
      # owned children) in a RELEASE test binary of the product components. The
      # cells are ignored tests, so no debug inventory run selects them; this is
      # their only run. Once per event (runtime shard 1). Real elapsed time
      # (~1 min); nextest's runner timeout owns hang detection, and each cell
      # has its own failure backstops. Not a product-ELF check (5a-V T3).
      - name: Real planned-shutdown expiry (release test binary)
        if: matrix.group == 'runtime' && matrix.shard == 1
        timeout-minutes: 40
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/guard-cargo.sh run -p evorch-core --release --features bootstrap-test-support --locked --test core_expiry --run-ignored only --test-threads 1 --no-tests fail
      # Only a push to main runs the registered former-GUI integration tests (the
      # inventory above lists and partitions them on every event). A pull request
      # that is green therefore does not say that they passed; a failure here fails
      # the job and so `ci`. docs/gui-verification.md says who checks main.
      - name: Main-only GUI tests (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.group == 'gui'
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/run-test-group.sh run "${{ matrix.group }}" "${{ matrix.shard }}/${{ matrix.shards }}" main-only-gui "$EVORCH_TEST_INVENTORY_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.group == 'runtime'
        with:
          name: core-sigkill-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/core-sigkill
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-inventory-${{ matrix.group }}-${{ matrix.shard }}
          if-no-files-found: error
          path: ${{ env.EVORCH_TEST_INVENTORY_DIR }}
      # 削除省略の閾値を見直せるよう、ビルド後の使用量を残す。
      - name: Report disk usage
        if: always()
        run: df -h /

  # The only writer of the shared dependency cache (key *-ci-workspace-v2) that
  # every cargo job restores: lint, docs-schema, otel, the test groups,
  # offscreen-gate, gui-evidence, browser-e2e and cef-e2e. It runs on
  # main pushes only, so it is never on a PR's critical path and PRs never
  # crowd the repository's 10GB cache budget. It compiles every dependency
  # artifact the other jobs need, with each of their own package and feature
  # selections: the workspace check, the handoff fixtures and the non-Linux
  # sandbox check (lint), the doctests and the schema example (docs-schema),
  # the otel-exporter build
  # (otel), the test binaries of every group in scripts/ci-test-groups.json
  # (the test jobs, offscreen-gate and gui-evidence share the gui group's
  # selection) and the browser-e2e and cef-e2e selections, which resolve
  # features differently. It does not run the normal nextest suite (the
  # doctests above do run). A failing recipe fails the job, and rust-cache does
  # not save after a failure, so a partial cache is never written. The browser
  # and CEF selections must match the readers' `prepare` and `cargo build`
  # lines (scripts/tests/test_ci_workflow_config.sh compares them).
  cache-save:
    if: github.ref == 'refs/heads/main'
    needs: product-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      - uses: ./.github/actions/setup-cef
      # An exact hit means the cache already holds this lockfile's dependency
      # artifacts, so the recipe below would only rebuild them and the action ends
      # with "Cache up-to-date" without saving: the steps that exist for the recipe
      # are skipped then. Any other output (a partial restore, a miss, no value)
      # runs every recipe step, as before.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: workspace-cache
        with:
          shared-key: ${{ runner.os }}-ci-workspace-v2
          save-if: true
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: steps.workspace-cache.outputs.cache-hit != 'true'
        with:
          tool: cargo-nextest
      # The doctests run (they start owned children through the library policy), so
      # they need the same sealed helper bundle as docs-schema.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.workspace-cache.outputs.cache-hit != 'true'
        with:
          name: product-core
          path: ${{ runner.temp }}/product-download
      - name: Install the sealed product artifact
        if: steps.workspace-cache.outputs.cache-hit != 'true'
        run: scripts/product-artifact.sh install "$RUNNER_TEMP/product-download" "$RUNNER_TEMP/evorch-product" >> "$GITHUB_ENV"
      - name: Build the dependencies of every other job
        if: steps.workspace-cache.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          cargo clippy --workspace --all-targets --locked
          cargo clippy -p event-bus --all-targets --features otel-exporter --locked
          cargo clippy -p core-instance -p core-launcher --all-targets --features core-instance/recovery-test-support,core-launcher/handoff-test-support --locked
          rustup target add aarch64-apple-darwin
          cargo check --target aarch64-apple-darwin -p sandbox --lib --locked
          cargo test --workspace --exclude workbench-authority --doc --locked
          cargo test --locked -p workbench-authority --doc --no-default-features
          cargo build --locked -p config --example dump_schema
          cargo nextest list -p event-bus --features otel-exporter --locked > /dev/null
          for group in $(jq -r '.groups | keys[]' scripts/ci-test-groups.json); do
            echo "::group::build the test binaries of $group"
            scripts/run-contract-tests.sh --group "$group" --list default > /dev/null
            echo "::endgroup::"
          done
      # The tests job's support fixtures and the browser-e2e and cef-e2e jobs
      # resolve features per invocation, differently from the group builds above,
      # so each is its own invocation (never one workspace-wide feature union).
      # `prepare` builds and lists the test binaries and runs none of them; its
      # metadata goes to a directory that is dropped.
      - name: Build the dependencies of the fixture, browser and CEF test selections
        if: steps.workspace-cache.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          warm=$(mktemp -d "$RUNNER_TEMP/warm.XXXXXX")
          trap 'rm -rf "$warm"' EXIT
          # One definition of the test name: the env of browser-e2e.
          HOST_LIFECYCLE_TEST=$(sed -n 's/^ *HOST_LIFECYCLE_TEST: *//p' .github/workflows/ci.yml)
          test -n "$HOST_LIFECYCLE_TEST"
          scripts/guard-cargo.sh prepare "$warm/support-1" -p core-instance --features recovery-test-support --locked
          scripts/guard-cargo.sh prepare "$warm/support-2" -p core-launcher --test handoff --test preflight_regression --features handoff-test-support,core-instance/recovery-test-support --locked
          scripts/guard-cargo.sh prepare "$warm/browser-1" -p browser --test agent_chromium --test agent_observation
          scripts/guard-cargo.sh prepare "$warm/browser-2" -p workbench-host --test "$HOST_LIFECYCLE_TEST"
          scripts/guard-cargo.sh prepare "$warm/browser-3" -p evorch-core --test agent_observation_chromium
          scripts/guard-cargo.sh prepare "$warm/browser-4" -p workbench-web --test web_ui_chromium
          scripts/guard-cargo.sh prepare "$warm/browser-5" -p workbench-web --test public_restart_chromium
          scripts/guard-cargo.sh prepare "$warm/cef-1" -p browser-cef --features cef
          cargo build -p browser-cef --features cef --bin evorch-cef-helper
          scripts/guard-cargo.sh prepare "$warm/cef-2" -p evorch-renderer
          cargo build -p evorch-renderer
          scripts/guard-cargo.sh prepare "$warm/cef-3" -p evorch-core --features renderer-test-helper --test renderer_owner_cef
          scripts/guard-cargo.sh prepare "$warm/cef-4" -p core-client-e2e --features gui/cef --test preview_cef
          scripts/guard-cargo.sh prepare "$warm/cef-5" -p gui --lib
          scripts/guard-cargo.sh prepare "$warm/cef-6" -p evorch-core --test f4_product_cef --test agent_observation_restart
          scripts/guard-cargo.sh prepare "$warm/cef-7" -p core-client-e2e --features gui/cef --test agent_observation_gui
          scripts/guard-cargo.sh prepare "$warm/expiry-1" -p evorch-core --release --features bootstrap-test-support --test core_expiry --locked
      - name: Report disk usage
        if: always()
        run: |
          df -h /
          if [ -d target/ci-shared ]; then
            du -sh target/ci-shared
          else
            echo "target/ci-shared is absent"
          fi

  # nix run / nix build が cargo test では拾えない sandbox 固有の失敗
  # (DNS resolver 初期化等) で壊れたまま main に入るのを防ぐ (2026-09-14 事象)。
  #
  # フルビルド (Nix package build) は main への push と、Nix に影響する変更を含む
  # PR だけで走らせる。判定は scripts/nix-build-scope.sh (対象パスと根拠はその
  # 冒頭コメント)。それ以外の PR は、Nix の cargoArgs と同じ -p/--bin 指定の
  # 非テスト構成 cargo check で代替する。ci job は workspace 全体を --all-targets
  # で見るため、dev-dependency が有効化する feature (test-support 等) が混ざり、
  # -p 単位のビルドでだけ出る不具合 (2026-11-09 の TestSeams 事象) を見逃す。
  #
  # Nix のジョブは 4 つに分かれる。check 名 `nix-build` は集約 job が引き継ぐ。
  #   nix-scope-check   scope 判定と、非 full 時 (と main) の cargo check
  #   nix-full-default  .#default (CLI と CEF GUI) とその依存、attic client
  #   nix-full-core     .#evorch-core (default の closure に入らない配布物)
  #   nix-build         上の 3 つの結果を scripts/nix-build-verdict.sh で判定
  # full の 2 job は nix-scope-check の結果 (success かつ full=true) だけで始まり、
  # quick-checks や otel の成否には結合しない (`!cancelled()`): それらが失敗しても
  # main の Nix build と attic への保存が skip されないようにする。
  nix-scope-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      full: ${{ steps.scope.outputs.full }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The scope check diffs the PR's test merge commit against its first parent.
          fetch-depth: 2
      - name: Decide whether the Nix package build is needed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        # A script failure fails the step, and a missing output leaves `full`
        # empty: the nix-build aggregate treats both as a failure, never as the
        # cargo-check-only case.
        run: |
          set -o pipefail
          scripts/tests/test_nix_build_scope.sh
          scripts/tests/test_nix_build_verdict.sh
          scripts/nix-build-scope.sh | tee -a "$GITHUB_OUTPUT"
      # Pull requests without Nix-affecting changes run this instead of the
      # package build. The toolchain comes from the rust-toolchain action (the
      # nix dev shell would need tailscale, nix and an attic fetch first) and
      # the dependencies from a rust-cache that pushes to main save. main runs
      # it too, to keep that cache current; this job is its only writer.
      - name: Install linker and Claude transport build dependencies
        if: steps.scope.outputs.full == 'false' || github.ref == 'refs/heads/main'
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold cmake clang libclang-dev ninja-build perl git
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.scope.outputs.full == 'false' || github.ref == 'refs/heads/main'
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.full == 'false' || github.ref == 'refs/heads/main'
        with:
          shared-key: ${{ runner.os }}-nix-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The packages and binaries of shippedCargoArgs in flake.nix (x86_64-linux),
      # release profile, no tests: the Nix package's build minus code generation.
      # Keep the two in step.
      - name: Check the shipped binaries without test configuration
        if: steps.scope.outputs.full == 'false' || github.ref == 'refs/heads/main'
        timeout-minutes: 30
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
        run: cargo check --locked --release -p evorch -p evorch-core -p process-guard --bin evorch --bin evorch-core --bin evorch-process-guard

  # The CLI and CEF GUI path: the patched attic client, the dependency builds
  # and the default package. Runs beside nix-full-core.
  nix-full-default:
    if: ${{ !cancelled() && needs.nix-scope-check.result == 'success' && needs.nix-scope-check.outputs.full == 'true' }}
    needs: nix-scope-check
    runs-on: ubuntu-latest
    # A cold deps build takes ~35-45 min and the attic push step is capped at 60.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Setup attic client
        run: |
          nix run --inputs-from . nixpkgs#attic-client -- login --set-default home https://attic.taile2777.ts.net "$ATTIC_TOKEN"
          nix run --inputs-from . nixpkgs#attic-client -- use home
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      - name: Build patched attic client
        run: |
          # Build on PRs too so changes to the upload timeout patch are checked.
          nix build -L .#attic-client --out-link ./result-attic
      - name: Build CLI dependencies
        run: nix build -L .#evorch-deps --out-link ./result-deps
      - name: Cache PR CLI dependencies in attic
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # Cache completed deps before later builds can fail or be cancelled.
          if ! ATTIC_PUSH_ATTEMPTS=1 ATTIC_PUSH_TIMEOUT=290s scripts/push-attic.sh ./result-deps; then
            echo "::warning::PR CLI dependency upload failed or timed out; continuing the build"
          fi
      - name: Build CEF dependencies
        run: nix build -L .#evorch-gui-cef-deps --out-link ./result-cef-deps
      - name: Cache PR CEF dependencies in attic
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! ATTIC_PUSH_ATTEMPTS=1 ATTIC_PUSH_TIMEOUT=290s scripts/push-attic.sh ./result-cef-deps; then
            echo "::warning::PR CEF dependency upload failed or timed out; continuing the build"
          fi
      # The default package is the CLI from .#evorch plus the CEF GUI on
      # x86_64-linux (ADR 0034), so one build runs both install checks (CLI
      # startup, ELF linkage after runtime fixup, the CEF layout). .#evorch
      # builds no non-CEF GUI there, and its closure is part of the default
      # package's, so the attic push below covers it.
      - name: Build and smoke-test flake package in the Nix sandbox
        run: nix build -L .#default --out-link ./result-default
      - name: Push to attic
        if: success() && github.ref == 'refs/heads/main'
        timeout-minutes: 60
        run: |
          # How the runner reaches attic (direct or DERP relay) bounds throughput.
          timeout 60 sudo tailscale ping -c 3 attic.taile2777.ts.net || true
          scripts/push-attic.sh ./result-attic ./result-default ./result-deps ./result-cef-deps

  # evorch-core is not in the default package's closure (that one carries the
  # core of `evorch`), but it is a distribution of its own with its own helper
  # bundle; its install check (bundle verify and a child through the pinned
  # helper image) runs only when it is built. It has its own runner, so it does
  # not see what nix-full-default pushes to attic in the same run: the shared
  # dependencies may build twice. main uploads the result it builds, with the
  # patched attic client built here.
  nix-full-core:
    if: ${{ !cancelled() && needs.nix-scope-check.result == 'success' && needs.nix-scope-check.outputs.full == 'true' }}
    needs: nix-scope-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Setup attic client
        run: |
          nix run --inputs-from . nixpkgs#attic-client -- login --set-default home https://attic.taile2777.ts.net "$ATTIC_TOKEN"
          nix run --inputs-from . nixpkgs#attic-client -- use home
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      - name: Build and smoke-test the evorch-core package in the Nix sandbox
        run: nix build -L .#evorch-core --out-link ./result-core
      # Only main uploads; scripts/push-attic.sh runs the client at
      # ./result-attic/bin/attic of this runner.
      - name: Build patched attic client
        if: github.ref == 'refs/heads/main'
        run: nix build -L .#attic-client --out-link ./result-attic
      - name: Push to attic
        if: success() && github.ref == 'refs/heads/main'
        timeout-minutes: 60
        run: |
          timeout 60 sudo tailscale ping -c 3 attic.taile2777.ts.net || true
          scripts/push-attic.sh ./result-core

  # The check name that stays: the verdict over the three jobs above.
  # scripts/nix-build-verdict.sh holds the truth table and its test.
  nix-build:
    if: always()
    needs: [nix-scope-check, nix-full-default, nix-full-core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verdict over the Nix jobs
        env:
          SCOPE_RESULT: ${{ needs.nix-scope-check.result }}
          SCOPE_FULL: ${{ needs.nix-scope-check.outputs.full }}
          DEFAULT_RESULT: ${{ needs.nix-full-default.result }}
          CORE_RESULT: ${{ needs.nix-full-core.result }}
        run: scripts/nix-build-verdict.sh

  # v0.1: offscreen 描画検証。wgpu の software Vulkan (lavapipe) で実 render し、
  # ignored の GUI テストを実行する（ADR 0009 / issue #9 の受理基準）。
  # 証跡マトリクスと native/Wayland 検査は並列の gui-evidence job が担う。
  offscreen-gate:
    # A push to main only: the ignored GUI tests and the evidence they write are not
    # part of a pull request's run (docs/gui-verification.md). The job fails on main
    # when they fail; it is not one of the jobs `ci` needs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scope-gate
    # The artifact wait reads this run's jobs (actions: read); nothing else is
    # granted. The workflow has no top-level permissions.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      # The shared dependency cache of the ci jobs (written by cache-save on main
      # pushes). Its key hashes the job-level CARGO_* / RUSTFLAGS env, so this job
      # sets exactly cache-save's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace-v2
          save-if: false
      # The Azure Ubuntu mirror once served packages at tens of kB/s for over an
      # hour (2026-10-23). The action caches the .debs per package set and runner
      # image, and a verified cache installs without reaching any mirror.
      - name: Install headless rendering and isolated X11/Wayland deps
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libglx-mesa0 mold xvfb openbox xdotool imagemagick jq weston libx11-6 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0 cmake clang libclang-dev ninja-build perl git
      # Only a libcef.so link: the distribution's own Vulkan loader would shadow
      # the system one the lavapipe renders below go through.
      - uses: ./.github/actions/setup-cef
      - name: Prepare evidence directories
        run: mkdir -p target/gui-evidence/model-metadata /tmp/opencode
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      # The ignored GUI tests start owned children: the helper bundle of the sealed
      # product is bound to the test binaries by scripts/guard-cargo.sh below.
      # The test binaries of the ignored GUI run are built while the product
      # artifact job is still running (`prepare` compiles and lists, it runs no
      # test). The listing is dropped: the run below prepares again after the
      # install, so what it executes is bound to the sealed helper bundle.
      - name: Warm the target of the ignored GUI tests (no product needed)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          warm=$(mktemp -d "$RUNNER_TEMP/warm.XXXXXX")
          trap 'rm -rf "$warm"' EXIT
          sel=$(jq -r '.groups.gui | [(.packages[] | "-p " + .), (.features[]? | "-F " + .)] | join(" ")' scripts/ci-test-groups.json)
          # shellcheck disable=SC2086 # the selection is a list of words
          scripts/guard-cargo.sh prepare "$warm" --locked $sel
      # The product artifact job runs beside this job (no `needs`): wait for its
      # success, take this run's artifact, check it was built from this commit,
      # then verify and install it. Nothing that runs a product test or a product
      # binary comes before this.
      - name: Wait for the product artifact job
        timeout-minutes: 31
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/wait-product-artifact.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: product-core
          path: ${{ runner.temp }}/product-download
      - name: Check the product artifact was built from this commit
        run: scripts/wait-product-artifact.sh check-source "$RUNNER_TEMP/product-download"
      - name: Install the sealed product artifact
        run: scripts/product-artifact.sh install "$RUNNER_TEMP/product-download" "$RUNNER_TEMP/evorch-product" >> "$GITHUB_ENV"
      # The ignored html_preview tests start a real CEF; the cef-e2e job runs them.
      - name: Run all ignored GUI tests (required real render)
        # Selects the packages and features of the gui test group, which cache-save
        # builds (scripts/ci-test-groups.json): rust-cache only reuses dependency
        # artifacts whose feature resolution matches, and `-p gui` alone resolves
        # differently. The filter keeps the gui package's tests that the earlier
        # `-p gui --tests` run selected.
        run: |
          sel=$(jq -r '.groups.gui | [(.packages[] | "-p " + .), (.features[]? | "-F " + .)] | join(" ")' scripts/ci-test-groups.json)
          scripts/guard-cargo.sh run --locked $sel --test-threads 1 --run-ignored only -E 'package(=gui) & not (kind(lib) & test(/^html_preview::tests::/))' --success-output immediate --no-tests fail
        env:
          CARGO_TARGET_DIR: target/ci-shared
          EVORCH_REQUIRE_ADAPTER: "1"
          # Cargo runs tests from the crate directory, not the workspace root.
          EVORCH_METADATA_EVIDENCE: ${{ github.workspace }}/target/gui-evidence/model-metadata
          WGPU_BACKEND: vulkan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gui-test-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            target/gui-evidence
            .opencode/v04-captures
            /tmp/opencode/*.png

  # The evidence matrix (3 themes x 40 PNGs), the native Xvfb check and the
  # Wayland idle check. headless_capture and native_qa_window are built once and
  # started directly, so this job needs the gui library but none of the test
  # binaries that offscreen-gate builds.
  gui-evidence:
    # A push to main only, like offscreen-gate. The evidence artifact stays; the
    # pull request screenshots the GUI PR evidence workflow attached are paused.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scope-gate
    # The artifact wait reads this run's jobs (actions: read); nothing else is
    # granted. The workflow has no top-level permissions.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The same job-level env as cache-save: rust-cache hashes CARGO_* and RUSTFLAGS
    # into its key, so a different set restores nothing. CARGO_TARGET_DIR is set on
    # the steps that run cargo only.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      # The shared dependency cache of the ci jobs (written by cache-save on main
      # pushes). Its key hashes the job-level CARGO_* / RUSTFLAGS env, so this job
      # sets exactly cache-save's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace-v2
          save-if: false
      # The Azure Ubuntu mirror once served packages at tens of kB/s for over an
      # hour (2026-10-23). The action caches the .debs per package set and runner
      # image, and a verified cache installs without reaching any mirror.
      - name: Install headless rendering and isolated X11/Wayland deps
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libglx-mesa0 mold xvfb openbox xdotool imagemagick jq weston libx11-6 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0 cmake clang libclang-dev ninja-build perl git
      # Only a libcef.so link: the distribution's own Vulkan loader would shadow
      # the system one the lavapipe renders below go through.
      - uses: ./.github/actions/setup-cef
      - name: Prepare evidence directories
        run: mkdir -p target/gui-evidence
      - name: Build the evidence binaries
        env:
          CARGO_TARGET_DIR: target/ci-shared
        # Same selection as offscreen-gate, for the same cache reason. Naming one
        # small integration test makes Cargo resolve features with the dev
        # dependencies, as the gui group's test build does, without building every
        # test binary.
        run: |
          sel=$(jq -r '.groups.gui | [(.packages[] | "-p " + .), (.features[]? | "-F " + .)] | join(" ")' scripts/ci-test-groups.json)
          cargo build --locked $sel --bin headless_capture --bin native_qa_window --test evidence_policy
      # headless_capture and native_qa_window are started directly and are not
      # applications that scripts/guard-artifact.sh binds; the library policy
      # reads the sealed product's helper bundle from EVORCH_PROCESS_GUARD_BUNDLE.
      # The product artifact job runs beside this job (no `needs`): wait for its
      # success, take this run's artifact, check it was built from this commit,
      # then verify and install it. Nothing that runs a product test or a product
      # binary comes before this.
      - name: Wait for the product artifact job
        timeout-minutes: 31
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/wait-product-artifact.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: product-core
          path: ${{ runner.temp }}/product-download
      - name: Check the product artifact was built from this commit
        run: scripts/wait-product-artifact.sh check-source "$RUNNER_TEMP/product-download"
      - name: Install the sealed product artifact
        run: scripts/product-artifact.sh install "$RUNNER_TEMP/product-download" "$RUNNER_TEMP/evorch-product" >> "$GITHUB_ENV"
      - name: Capture size and DPI evidence matrix
        run: scripts/gui-evidence-matrix.sh
        env:
          HEADLESS_CAPTURE_BIN: ${{ github.workspace }}/target/ci-shared/debug/headless_capture
          WGPU_BACKEND: vulkan
      - name: Exercise native GUI in a private Xvfb
        run: scripts/check-gui-native.sh target/gui-evidence/native
        env:
          GUI_BIN: ${{ github.workspace }}/target/ci-shared/debug/native_qa_window
      - name: Check Wayland redraw wait and idle budgets in a private Weston
        run: scripts/check-gui-wayland-idle.sh target/gui-evidence/wayland-idle
        env:
          GUI_BIN: ${{ github.workspace }}/target/ci-shared/debug/native_qa_window
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gui-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: target/gui-evidence

  browser-e2e:
    # Behind quick-checks: it needs the product artifact for the tests it runs, and
    # starting next to the producer made this runner wait for it. quick-checks ends
    # well before the producer does.
    needs: [scope-gate, quick-checks]
    # The artifact wait reads this run's jobs (actions: read); nothing else is
    # granted. The workflow has no top-level permissions.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # The same job-level env as cache-save: rust-cache hashes CARGO_* and RUSTFLAGS
    # into its key, so a different set restores nothing. CARGO_TARGET_DIR is set on
    # the steps that run cargo only.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
      # The host source lifecycle test of O-V1 (crates/workbench-host/tests/<name>.rs,
      # an ignored test that needs the Chromium found above through CHROME): the
      # one place to change when O-V1 renames its binary.
      HOST_LIFECYCLE_TEST: agent_observation_lifecycle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace-v2
          save-if: false
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold cmake clang libclang-dev ninja-build perl git
      - name: Locate Chrome/Chromium executable
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      # The five test selections below are compiled while the product artifact job
      # is still running (`prepare` compiles and lists, it runs no test). The
      # listings are dropped: every run after the install prepares again, so what
      # it executes is bound to the sealed helper bundle.
      - name: Warm the target of the browser tests (no product needed)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          warm=$(mktemp -d "$RUNNER_TEMP/warm.XXXXXX")
          trap 'rm -rf "$warm"' EXIT
          scripts/guard-cargo.sh prepare "$warm/1" -p browser --test agent_chromium --test agent_observation
          scripts/guard-cargo.sh prepare "$warm/2" -p workbench-host --test "$HOST_LIFECYCLE_TEST"
          scripts/guard-cargo.sh prepare "$warm/3" -p evorch-core --test agent_observation_chromium
          scripts/guard-cargo.sh prepare "$warm/4" -p workbench-web --test web_ui_chromium
          scripts/guard-cargo.sh prepare "$warm/5" -p workbench-web --test public_restart_chromium
      # The sealed product closure comes before the first browser test: every run
      # below is bound to its helper bundle by scripts/guard-cargo.sh. I0 registered
      # the O-V1 and O-V2 targets; the placeholders only prove the targets are
      # selected (--no-tests fail), and the second one checks the sealed product
      # artifact the job downloaded.
      # The product artifact job runs beside this job (no `needs`): wait for its
      # success, take this run's artifact, check it was built from this commit,
      # then verify and install it. Nothing that runs a product test or a product
      # binary comes before this.
      - name: Wait for the product artifact job
        timeout-minutes: 31
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/wait-product-artifact.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: product-core
          path: ${{ runner.temp }}/product-download
      - name: Check the product artifact was built from this commit
        run: scripts/wait-product-artifact.sh check-source "$RUNNER_TEMP/product-download"
      - name: Install the sealed product artifact
        run: scripts/product-artifact.sh install "$RUNNER_TEMP/product-download" "$RUNNER_TEMP/evorch-product" >> "$GITHUB_ENV"
      - name: Run agent browser test
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/guard-cargo.sh run -p browser --test agent_chromium --test agent_observation --run-ignored only --success-output immediate --no-tests fail
      - name: Run the host observation source lifecycle against Chromium
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/guard-cargo.sh run -p workbench-host --test "$HOST_LIFECYCLE_TEST" --run-ignored only --success-output immediate --no-tests fail
      - name: Run the core observation test against Chromium
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/guard-cargo.sh run -p evorch-core --test agent_observation_chromium --run-ignored only --success-output immediate --no-tests fail
      - name: Run web workbench browser test
        env:
          CARGO_TARGET_DIR: target/ci-shared
          WORKBENCH_WEB_SCREENSHOT_DIR: ${{ github.workspace }}/target/web-ui-screenshots
        run: scripts/guard-cargo.sh run -p workbench-web --test web_ui_chromium --run-ignored only --success-output immediate --no-tests fail
      # Registered by the 5a-I integration PR for CW: a placeholder target until the
      # leaf adds the browser test of the public restart management (the contract
      # tests over real HTTP are public_restart_contracts).
      - name: Run the public restart web browser test
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/guard-cargo.sh run -p workbench-web --test public_restart_chromium --run-ignored only --success-output immediate --no-tests fail
      # D-3a2 B3-08: the sealed product core navigates a real Chromium through
      # browser_navigate, then only the core is SIGKILLed. Chromium trusts the
      # cell's loopback CA only through an NSS database that the cell builds
      # under its own temporary HOME with certutil (libnss3-tools).
      - name: Install certutil for the Chromium core SIGKILL cell
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: libnss3-tools
      - name: Real Chromium core SIGKILL cell
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export EVORCH_B3_EVIDENCE_DIR="$RUNNER_TEMP/core-browser-sigkill"
          scripts/guard-cargo.sh run -p evorch-core --test core_browser_sigkill -E 'test(=chromium_p)' --run-ignored only --success-output immediate --no-tests fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-browser-sigkill-chromium
          if-no-files-found: warn
          path: ${{ runner.temp }}/core-browser-sigkill
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-ui-screenshots
          if-no-files-found: warn
          path: target/web-ui-screenshots

  # ADR 0034 B: the real CEF HTML preview. setup-cef installs the pinned
  # distribution (scripts/setup-cef.sh) that every job's build now links; this
  # job also starts it. The lint of the CEF feature is the workspace clippy in
  # the lint job, which builds gui with its default features.
  cef-e2e:
    needs: scope-gate
    # The artifact wait reads this run's jobs (actions: read); nothing else is
    # granted. The workflow has no top-level permissions.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # One job runs all seven real-CEF invocations: the browser-cef isolation and
    # recovery tests, the renderer helper and the core renderer owner (the engine
    # half), then the core-client page, the html_preview cards, the product
    # tests and the GUI observation (the client half). It warms and builds both
    # halves while the producer runs and writes no cache (cache-save does).
    # The same job-level env as cache-save: rust-cache hashes CARGO_* and RUSTFLAGS
    # into its key. CARGO_TARGET_DIR is set on the steps that run cargo only.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      # Restore only: the cache-save job writes the shared dependency cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-ci-workspace-v2
          save-if: false
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold cmake clang libclang-dev ninja-build perl git
      # CEF reads its resources beside the libcef.so it was loaded from.
      - uses: ./.github/actions/setup-cef
        with:
          runtime-path: full
      # Chromium's sandbox needs unprivileged user namespaces; the SUID
      # chrome-sandbox is never used (ADR 0034).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The GUI observation test uses the same browser as the Chromium job, so the
      # runner's Chromium is located here as well as CEF.
      - name: Locate Chrome/Chromium executable
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
      # The real-CEF selections of this cell are compiled, in their own order and
      # with their own helper/renderer builds, while the product artifact job is
      # still running (`prepare` compiles and lists, it runs no test). The listings
      # are dropped: every run after the install builds and prepares again, so what
      # it executes is bound to the sealed helper bundle.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Warm the target of the engine real-CEF tests (no product needed)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          warm=$(mktemp -d "$RUNNER_TEMP/warm.XXXXXX")
          trap 'rm -rf "$warm"' EXIT
          scripts/guard-cargo.sh prepare "$warm/1" -p browser-cef --features cef
          cargo build -p browser-cef --features cef --bin evorch-cef-helper
          scripts/guard-cargo.sh prepare "$warm/2" -p evorch-renderer
          cargo build -p evorch-renderer
          scripts/guard-cargo.sh prepare "$warm/3" -p evorch-core --features renderer-test-helper --test renderer_owner_cef
      - name: Warm the target of the client real-CEF tests (no product needed)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          warm=$(mktemp -d "$RUNNER_TEMP/warm.XXXXXX")
          trap 'rm -rf "$warm"' EXIT
          cargo build -p evorch-renderer
          cargo build -p browser-cef --features cef --bin evorch-cef-helper
          scripts/guard-cargo.sh prepare "$warm/4" -p core-client-e2e --features gui/cef --test preview_cef
          cargo build -p browser-cef --features cef --bin evorch-cef-helper
          scripts/guard-cargo.sh prepare "$warm/5" -p gui --lib
          scripts/guard-cargo.sh prepare "$warm/6" -p evorch-core --test f4_product_cef --test agent_observation_restart
          scripts/guard-cargo.sh prepare "$warm/7" -p core-client-e2e --features gui/cef --test agent_observation_gui
      # The product artifact job runs beside this job (no `needs`): wait for its
      # success, take this run's artifact, check it was built from this commit,
      # then verify and install it. Nothing that runs a product test or a product
      # binary comes before this.
      - name: Wait for the product artifact job
        timeout-minutes: 31
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/wait-product-artifact.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: product-core
          path: ${{ runner.temp }}/product-download
      - name: Check the product artifact was built from this commit
        run: scripts/wait-product-artifact.sh check-source "$RUNNER_TEMP/product-download"
      - name: Install the sealed product artifact
        run: scripts/product-artifact.sh install "$RUNNER_TEMP/product-download" "$RUNNER_TEMP/evorch-product" >> "$GITHUB_ENV"
      - name: CEF offline isolation and crash recovery
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/guard-cargo.sh run -p browser-cef --features cef --run-ignored all --success-output immediate --no-tests fail
      # The real renderer binary beside the CEF helper it starts (16a-2). The
      # ignored tests are the only ones that run real CEF in the renderer
      # process; the ordinary matrix runs the fake helper instead.
      - name: Out-of-process renderer helper through real CEF
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          cargo build -p browser-cef --features cef --bin evorch-cef-helper
          scripts/guard-cargo.sh run -p evorch-renderer --run-ignored all --success-output immediate --no-tests fail
      # Production core owner tests replace the installation placeholder in F1.
      - name: Core renderer owner through real CEF
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          cargo build -p evorch-renderer
          export EVORCH_RENDERER_EXE="$PWD/target/ci-shared/debug/evorch-renderer"
          scripts/guard-cargo.sh run -p evorch-core --features renderer-test-helper --test renderer_owner_cef --run-ignored only --success-output immediate --no-tests fail
      # Stage 16b PR V: the core-client page against a production core and the real
      # helper (conversation -> artifact -> preview -> inspection; exit and kill).
      - name: Core-client page through real CEF
        env:
          CARGO_TARGET_DIR: target/ci-shared
