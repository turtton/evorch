name: ci

on:
  push:
    branches:
      - main
  pull_request:

# 同一 ref への連続 push / PR 更新で古い実行を中断し、runner を無駄遣いしないようにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Normal runs take ~13 min; a cold dependency cache roughly doubles that.
    timeout-minutes: 60
    # workspace 全体 + browser feature + otel-exporter feature のビルドで
    # runner のディスクが枯渇したため (2026-09-11 No space left on device)、
    # docs/browser.md の低リソース指定を job 全体に適用し未使用ツールを削除する。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # gui/wgpu 系の linking が重いため mold で短縮する (feature 差分の
      # 再ビルド自体は cargo の fingerprint で避けられないため linker を速くする)。
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
      EVORCH_CI_METADATA_DIR: target/ci-metadata
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Claude compatibility skill offline tools
        run: node --test .agents/skills/claude-code-compatibility/scripts/inspect-client-hello.test.mjs
      # 2026-10-09 時点の runner は root の空きが約 86G あり、削除 (android だけで
      # 71s) は不要になった。空きが少ない runner でだけ従来どおり削除する。
      - name: Free runner disk space
        run: |
          df -h /
          avail_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$avail_gb" -ge 60 ]; then
            echo "skip cleanup: ${avail_gb}G available"
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt,clippy
      - name: Install linker, search, and Claude transport build dependencies
        # crates/tools の grep テストが rg を必要とするが、ubuntu-latest から
        # ripgrep が外れたため明示インストールする (2026-09-11 欠落確認)。
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold ripgrep cmake clang libclang-dev ninja-build perl git
      # ジョブ内の依存キャッシュを復元する。profile/feature が異なるジョブは別キー。
      # PR ごとの保存は repo の cache 上限 (10GB) を圧迫するため main でのみ保存する。
      # Keep CARGO_TARGET_DIR scoped to Cargo steps below: the cache action's
      # restore key and post-save cargo metadata both need it to be absent.
      # The action recursively caches target/, including target/ci-shared.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-cargo
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      # Compile the default workspace once; the contract gates and remainder use
      # these exact binaries so package selection cannot change dependency features.
      - name: Compile and lint check targets
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          # `browser` is a default GUI feature; keep the build without it compiling.
          cargo clippy -p gui --all-targets --no-default-features -- -D warnings
          cargo clippy -p event-bus --all-targets --features otel-exporter -- -D warnings
          mkdir -p "$EVORCH_CI_METADATA_DIR"
          cargo metadata --format-version 1 --locked > "$EVORCH_CI_METADATA_DIR/cargo.json"
          cargo nextest list --workspace --locked --list-type binaries-only --message-format json > "$EVORCH_CI_METADATA_DIR/default-binaries.json"
          cargo build -p config --example dump_schema
      # CI enforces cost-sensitive invariants with this offline gate. The mock
      # computes cache usage from received input; compaction has an explicit boundary.
      - name: Cache preservation contracts (offline)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/check-cache-contracts.sh
      - name: Storage I/O contracts (offline)
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/check-io-contracts.sh
      # nextest owns parallelism and the per-test hang watchdog. Every default
      # non-ignored test belongs to exactly one of these three suites.
      - name: Remaining workspace tests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: scripts/run-contract-tests.sh remaining
      - name: Workspace doctests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        timeout-minutes: 10
        run: cargo test --workspace --doc
      # ADR 0023: retain the opt-in OTLP end-to-end coverage.
      - name: Event bus otel-exporter tests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: cargo nextest run -p event-bus --features otel-exporter --no-tests fail
      - name: Event bus otel-exporter doctests
        env:
          CARGO_TARGET_DIR: target/ci-shared
        timeout-minutes: 10
        run: cargo test -p event-bus --features otel-exporter --doc
      # Config 型を変更したら versioned schema artifact も再生成が必要 (issue #33)。
      - name: Check config schema artifact is up to date
        env:
          CARGO_TARGET_DIR: target/ci-shared
        run: |
          cargo run -q -p config --example dump_schema -- docs/config/evorch-config-v3.schema.json
          git diff --exit-code docs/config/evorch-config-v3.schema.json
      # 削除省略の閾値を見直せるよう、ビルド後の使用量を残す。
      - name: Report disk usage
        if: always()
        run: df -h /

  # nix run / nix build が cargo test では拾えない sandbox 固有の失敗
  # (DNS resolver 初期化等) で壊れたまま main に入るのを防ぐ (2026-09-14 事象)。
  nix-build:
    runs-on: ubuntu-latest
    # A cold deps build takes ~35-45 min and the attic push step is capped at 60.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Setup attic client
        run: |
          nix run --inputs-from . nixpkgs#attic-client -- login --set-default home https://attic.taile2777.ts.net "$ATTIC_TOKEN"
          nix run --inputs-from . nixpkgs#attic-client -- use home
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      - name: Build patched attic client
        run: |
          # Build on PRs too so changes to the upload timeout patch are checked.
          nix build -L .#attic-client --out-link ./result-attic
      - name: Build CLI dependencies
        run: nix build -L .#evorch-deps --out-link ./result-deps
      - name: Cache PR CLI dependencies in attic
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # Cache completed deps before later builds can fail or be cancelled.
          if ! ATTIC_PUSH_ATTEMPTS=1 ATTIC_PUSH_TIMEOUT=290s scripts/push-attic.sh ./result-deps; then
            echo "::warning::PR CLI dependency upload failed or timed out; continuing the build"
          fi
      - name: Build CEF dependencies
        run: nix build -L .#evorch-gui-cef-deps --out-link ./result-cef-deps
      - name: Cache PR CEF dependencies in attic
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! ATTIC_PUSH_ATTEMPTS=1 ATTIC_PUSH_TIMEOUT=290s scripts/push-attic.sh ./result-cef-deps; then
            echo "::warning::PR CEF dependency upload failed or timed out; continuing the build"
          fi
      # The package also checks CLI startup and ELF linkage after runtime fixup.
      - name: Build and smoke-test flake package in the Nix sandbox
        run: |
          # Explicit out-links keep multiple installables' output names stable.
          nix build -L .#evorch --out-link ./result-evorch
          # The default package adds the CEF GUI build on x86_64-linux (ADR 0034).
          nix build -L .#default --out-link ./result-default
      - name: Push to attic
        if: success() && github.ref == 'refs/heads/main'
        timeout-minutes: 60
        run: |
          # How the runner reaches attic (direct or DERP relay) bounds throughput.
          timeout 60 sudo tailscale ping -c 3 attic.taile2777.ts.net || true
          scripts/push-attic.sh ./result-attic ./result-evorch ./result-default ./result-deps ./result-cef-deps

  # v0.1: offscreen 描画検証。wgpu の software Vulkan (lavapipe) で実 render し、
  # 生成 PNG を artifact として保存する（ADR 0009 / issue #9 の受理基準）。
  offscreen-gate:
    runs-on: ubuntu-latest
    # Warm runs took 10-23 min; leave room for a cold rust-cache.
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-cargo
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Azure Ubuntu mirror once served packages at tens of kB/s for over an
      # hour (2026-10-23). Every job restores one shared .deb cache; this job's
      # package set covers the others', so only it saves (on main).
      - name: Install headless rendering and isolated X11/Wayland deps
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libglx-mesa0 mold xvfb openbox xdotool imagemagick jq weston libx11-6 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0 cmake clang libclang-dev ninja-build perl git
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare evidence directories
        run: mkdir -p target/gui-evidence/model-metadata /tmp/opencode
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Run all ignored GUI tests (required real render)
        run: cargo nextest run -p gui --tests --test-threads 1 --run-ignored only --success-output immediate --no-tests fail
        env:
          EVORCH_REQUIRE_ADAPTER: "1"
          # Cargo runs tests from the crate directory, not the workspace root.
          EVORCH_METADATA_EVIDENCE: ${{ github.workspace }}/target/gui-evidence/model-metadata
          WGPU_BACKEND: vulkan
      - name: Capture size and DPI evidence matrix
        run: scripts/gui-evidence-matrix.sh
        env:
          WGPU_BACKEND: vulkan
      - name: Build native GUI fixture window
        run: cargo build -p gui --bin native_qa_window
      - name: Exercise native GUI in a private Xvfb
        run: scripts/check-gui-native.sh target/gui-evidence/native
      - name: Check Wayland redraw wait and idle budgets in a private Weston
        run: scripts/check-gui-wayland-idle.sh target/gui-evidence/wayland-idle
      - name: Prepare representative PR screenshots
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p target/gui-pr-preview
          cp 'target/gui-evidence/graphite/demo-1280x720@1.0.png' target/gui-pr-preview/01-workbench.png
          cp 'target/gui-evidence/graphite/panel-agent-main-1280x720@1.0.png' target/gui-pr-preview/02-conversation.png
          cp 'target/gui-evidence/graphite/panel-tasks-main-1280x720@1.0.png' target/gui-pr-preview/03-tasks.png
          cp 'target/gui-evidence/graphite/modal-provider-1280x720@1.0.png' target/gui-pr-preview/04-provider-settings.png
          cp 'target/gui-evidence/graphite/pending-approvals-1280x720@1.0.png' target/gui-pr-preview/05-approvals.png
          cp 'target/gui-evidence/high-contrast/demo-1280x720@1.0.png' target/gui-pr-preview/06-high-contrast.png
          jq -n --argjson pr "$PR_NUMBER" --arg sha "$PR_HEAD_SHA" --argjson run "$GITHUB_RUN_ID" \
            '{pr: $pr, head_sha: $sha, run_id: $run}' > target/gui-pr-preview/pr.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'pull_request'
        with:
          name: gui-pr-preview
          if-no-files-found: error
          path: target/gui-pr-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gui-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            target/gui-evidence
            .opencode/v04-captures
            /tmp/opencode/*.png

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-cargo
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold cmake clang libclang-dev ninja-build perl git
      - name: Locate Chrome/Chromium executable
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Run agent browser test
        run: cargo nextest run -p browser --test agent_chromium --run-ignored only --success-output immediate --no-tests fail

  # ADR 0034 B: the opt-in CEF HTML preview. cef-dll-sys downloads the CEF
  # build cef-rs pins into CEF_PATH; it is not cached because the extracted
  # distribution (~1.8 GB) would crowd the repository cache.
  cef-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
      CEF_PATH: ${{ github.workspace }}/../cef-dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-cef
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install linker and Claude transport build dependencies
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          packages: mold cmake clang libclang-dev ninja-build perl git
      # Chromium's sandbox needs unprivileged user namespaces; the SUID
      # chrome-sandbox is never used (ADR 0034).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Lint the CEF feature
        run: cargo clippy -p gui -p browser-cef --features gui/cef,browser-cef/cef --all-targets -- -D warnings
      - name: CEF offline isolation and crash recovery
        run: |
          export LD_LIBRARY_PATH="$PWD/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo nextest run -p browser-cef --features cef --run-ignored all --success-output immediate --no-tests fail
      - name: Card snapshots and agent artifact inspection through CEF
        run: |
          export LD_LIBRARY_PATH="$PWD/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export EVORCH_CEF_HELPER="$PWD/target/debug/evorch-cef-helper"
          cargo build -p browser-cef --features cef --bin evorch-cef-helper
          cargo nextest run -p gui --features cef --lib -E 'test(/^html_preview::tests::/)' --run-ignored only --success-output immediate --no-tests fail
