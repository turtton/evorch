name: ci

on:
  push:
    branches:
      - main
  pull_request:

# 同一 ref への連続 push / PR 更新で古い実行を中断し、runner を無駄遣いしないようにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # workspace 全体 + browser feature + otel-exporter feature のビルドで
    # runner のディスクが枯渇したため (2026-09-11 No space left on device)、
    # docs/browser.md の低リソース指定を job 全体に適用し未使用ツールを削除する。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # gui/wgpu 系の linking が重いため mold で短縮する (feature 差分の
      # 再ビルド自体は cargo の fingerprint で避けられないため linker を速くする)。
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
      CARGO_TARGET_DIR: target/ci-shared
      EVORCH_CI_METADATA_DIR: target/ci-metadata
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Install mold linker and ripgrep
        # crates/tools の grep テストが rg を必要とするが、ubuntu-latest から
        # ripgrep が外れたため明示インストールする (2026-09-11 欠落確認)。
        run: sudo apt-get update && sudo apt-get install -y mold ripgrep
      # ジョブ内の依存キャッシュを復元する。profile/feature が異なるジョブは別キー。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      # Compile the default workspace once; the contract gates and remainder use
      # these exact binaries so package selection cannot change dependency features.
      - name: Compile and lint check targets
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p gui --all-targets --features browser -- -D warnings
          cargo clippy -p event-bus --all-targets --features otel-exporter -- -D warnings
          mkdir -p "$EVORCH_CI_METADATA_DIR"
          cargo metadata --format-version 1 --locked > "$EVORCH_CI_METADATA_DIR/cargo.json"
          cargo nextest list --workspace --locked --list-type binaries-only --message-format json > "$EVORCH_CI_METADATA_DIR/default-binaries.json"
          cargo build -p config --example dump_schema
      # Cost-sensitive invariants also run in the local pre-push hook. The mock
      # computes cache usage from received input; compaction has an explicit boundary.
      - name: Cache preservation contracts (offline)
        run: scripts/check-cache-contracts.sh
      - name: Storage I/O contracts (offline)
        run: scripts/check-io-contracts.sh
      # nextest owns parallelism and the per-test hang watchdog. Every default
      # non-ignored test belongs to exactly one of these three suites.
      - name: Remaining workspace tests
        run: scripts/run-contract-tests.sh remaining
      - name: Workspace doctests
        timeout-minutes: 10
        run: cargo test --workspace --doc
      # The default GUI suite above retains default-feature coverage. Only the
      # browser module, its integration tests, and GUI startup need another run.
      - name: GUI browser feature tests
        run: |
          source scripts/contract-test-filters.sh
          cargo nextest run -p gui --features browser --lib --test browser --bin evorch-gui -E "$BROWSER_TEST_FILTER" --no-tests fail
      # ADR 0023: retain the opt-in OTLP end-to-end coverage.
      - name: Event bus otel-exporter tests
        run: cargo nextest run -p event-bus --features otel-exporter --no-tests fail
      - name: Event bus otel-exporter doctests
        timeout-minutes: 10
        run: cargo test -p event-bus --features otel-exporter --doc
      - name: GUI browser feature doctests
        timeout-minutes: 10
        run: cargo test -p gui --features browser --doc
      # Config 型を変更したら versioned schema artifact も再生成が必要 (issue #33)。
      - name: Check config schema artifact is up to date
        run: |
          cargo run -q -p config --example dump_schema -- docs/config/evorch-config-v2.schema.json
          git diff --exit-code docs/config/evorch-config-v2.schema.json

  # nix run / nix build が cargo test では拾えない sandbox 固有の失敗
  # (DNS resolver 初期化等) で壊れたまま main に入るのを防ぐ (2026-09-14 事象)。
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Setup attic client
        run: |
          nix profile install nixpkgs#attic-client
          attic login --set-default home https://attic.taile2777.ts.net "$ATTIC_TOKEN"
          attic use home
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      # Package builds validate sandbox-specific build dependencies; doCheck is false.
      - name: Build flake package in the Nix sandbox
        run: |
          # 複数 installable を一度に build すると out-link 命名が不定になるため
          # out-link を明示する。
          nix build -L .#evorch --out-link ./result-evorch
          nix build -L .#evorch-deps --out-link ./result-deps
      - name: Push to attic
        if: success()
        run: |
          # 最終 out のみでは build-time 依存 (crane cargoArtifacts / fenix toolchain /
          # vendored crate sources) が attic に入らず毎回再 build になるため、
          # 出力の runtime closure ごと push して次回 run で substitute させる。
          # tailscaled ingress stalls under concurrent large uploads (issue #72); retry with backoff
          CLOSURE=$(nix path-info --recursive ./result-evorch ./result-deps)
          for attempt in 1 2 3 4; do
            if echo "$CLOSURE" | xargs -r attic push home; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 120 + RANDOM % 60))
              echo "attic push failed (attempt $attempt/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          exit 1

  # v0.1: offscreen 描画検証。wgpu の software Vulkan (lavapipe) で実 render し、
  # 生成 PNG を artifact として保存する（ADR 0009 / issue #9 の受理基準）。
  offscreen-gate:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo
      - name: Install headless rendering and isolated X11/Wayland deps
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libglx-mesa0 mold xvfb openbox xdotool imagemagick jq weston libx11-6 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0
      - name: Prepare evidence directories
        run: mkdir -p target/gui-evidence/model-metadata /tmp/opencode
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run all ignored GUI tests (required real render)
        run: cargo nextest run -p gui --tests --test-threads 1 --run-ignored only --success-output immediate --no-tests fail
        env:
          EVORCH_REQUIRE_ADAPTER: "1"
          # Cargo runs tests from the crate directory, not the workspace root.
          EVORCH_METADATA_EVIDENCE: ${{ github.workspace }}/target/gui-evidence/model-metadata
          WGPU_BACKEND: vulkan
      - name: Capture size and DPI evidence matrix
        run: scripts/gui-evidence-matrix.sh
        env:
          WGPU_BACKEND: vulkan
      - name: Build native GUI fixture window
        run: cargo build -p gui --bin native_qa_window
      - name: Exercise native GUI in a private Xvfb
        run: scripts/check-gui-native.sh target/gui-evidence/native
      - name: Check Wayland redraw wait and idle budgets in a private Weston
        run: scripts/check-gui-wayland-idle.sh target/gui-evidence/wayland-idle
      - name: Prepare representative PR screenshots
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p target/gui-pr-preview
          cp 'target/gui-evidence/graphite/demo-1280x720@1.0.png' target/gui-pr-preview/01-workbench.png
          cp 'target/gui-evidence/graphite/panel-agent-main-1280x720@1.0.png' target/gui-pr-preview/02-conversation.png
          cp 'target/gui-evidence/graphite/panel-tasks-main-1280x720@1.0.png' target/gui-pr-preview/03-tasks.png
          cp 'target/gui-evidence/graphite/modal-provider-1280x720@1.0.png' target/gui-pr-preview/04-provider-settings.png
          cp 'target/gui-evidence/graphite/pending-approvals-1280x720@1.0.png' target/gui-pr-preview/05-approvals.png
          cp 'target/gui-evidence/high-contrast/demo-1280x720@1.0.png' target/gui-pr-preview/06-high-contrast.png
          jq -n --argjson pr "$PR_NUMBER" --arg sha "$PR_HEAD_SHA" --argjson run "$GITHUB_RUN_ID" \
            '{pr: $pr, head_sha: $sha, run_id: $run}' > target/gui-pr-preview/pr.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: gui-pr-preview
          if-no-files-found: error
          path: target/gui-pr-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            target/gui-evidence
            .opencode/v04-captures
            /tmp/opencode/*.png

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Locate Chrome/Chromium executable
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run Chromium browser evidence test
        run: cargo nextest run -p gui --features browser --lib -E 'test(=browser::tests::chromium_screencast_and_action_evidence)' --run-ignored only --success-output immediate --no-tests fail
        env:
          # Cargo runs tests from the crate directory, not the workspace root.
          EVORCH_BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/target/browser-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: target/browser-evidence
          # Fail loudly when the evidence contract breaks instead of uploading
          # an empty artifact (issue #114).
          if-no-files-found: error
