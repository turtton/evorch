name: setup-cef
description: >-
  Install the pinned CEF distribution for `gui`'s default `cef` feature and put
  libcef.so on the loader path (scripts/setup-cef.sh).
inputs:
  runtime-path:
    description: >-
      "libcef" puts only a libcef.so link on LD_LIBRARY_PATH, enough to load
      test binaries and the GUI fixtures. "full" puts the whole distribution
      there, which tests that start CEF need to find its resources; it also
      carries a Vulkan loader that shadows the system one, so use it only in
      jobs that do not render with wgpu.
    default: libcef
runs:
  using: composite
  steps:
    # Downloading and bzip2-extracting the archive costs about 45 s in every job,
    # so the extracted tree is cached. The cache is not trusted: setup-cef.sh uses
    # it only when its digest equals the tree_sha256 pinned in the checked-out
    # scripts/setup-cef.sh (files, symlinks and their targets, executable bits),
    # and otherwise discards it and fetches the archive, whose pinned sha256 it
    # checks before extracting. A fresh extraction is saved only after it matched
    # that pin. The key hashes the script, so a new pin or archive is a new entry.
    - id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/cef-src
        key: cef-src-${{ runner.os }}-${{ hashFiles('scripts/setup-cef.sh', 'scripts/cef-tree-digest.sh') }}
    - id: install
      shell: bash
      env:
        RUNTIME_PATH: ${{ inputs.runtime-path }}
      run: |
        set -euo pipefail
        dist="$RUNNER_TEMP/cef-dist"
        src="$RUNNER_TEMP/cef-src"
        scripts/setup-cef.sh "$dist" --src-cache "$src"
        if [[ -e "$src.fresh" ]]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi
        case "$RUNTIME_PATH" in
          full) lib="$dist" ;;
          libcef)
            lib="$RUNNER_TEMP/cef-libcef"
            mkdir -p "$lib"
            ln -s "$dist/libcef.so" "$lib/libcef.so"
            ;;
          *) echo "unknown runtime-path: $RUNTIME_PATH" >&2; exit 2 ;;
        esac
        {
          echo "CEF_PATH=$dist"
          echo "LD_LIBRARY_PATH=$lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        } >> "$GITHUB_ENV"
    - if: steps.install.outputs.save == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/cef-src
        key: cef-src-${{ runner.os }}-${{ hashFiles('scripts/setup-cef.sh', 'scripts/cef-tree-digest.sh') }}
