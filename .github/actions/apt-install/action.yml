name: apt-install
description: >-
  Install Ubuntu packages without Recommends. The .debs of a completed install are
  cached per package set and runner image; a cache hit installs them with dpkg and
  never reaches an Ubuntu mirror, so a mirror or DNS outage cannot fail the job.
inputs:
  packages:
    description: Space-separated package names.
    required: true
  cache-version:
    description: >-
      Part of the cache key. Change it to discard every cached .deb set at once.
    default: "2"
  timeout-seconds:
    description: Bound for each apt-get call on the fallback mirror.
    default: "600"
  primary-timeout-seconds:
    description: >-
      Bound for the install on the runner's default mirror before switching to
      archive.ubuntu.com. A normal install takes well under a minute.
    default: "180"
runs:
  using: composite
  steps:
    # The key is the package set plus the runner image version (ImageOS and
    # ImageVersion are runner environment variables, not part of the env
    # context). The cached .debs are exactly what apt downloaded on that image for
    # that set, so they only fit a runner with the same image; another image
    # version or another package set is a different key. Nothing pins the package
    # versions beyond that: a new image version or a changed package list is what
    # refreshes the cache.
    - id: key
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        CACHE_VERSION: ${{ inputs.cache-version }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 # word splitting is the package list
        set_hash=$(printf '%s\n' $APT_PACKAGES | LC_ALL=C sort -u | sha256sum | cut -c1-16)
        base="apt-debs-v${CACHE_VERSION}-${RUNNER_OS}-${ImageOS:-unknown}-${set_hash}"
        echo "prefix=${base}-" >> "$GITHUB_OUTPUT"
        echo "exact=${base}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/apt-archives
        key: ${{ steps.key.outputs.exact }}
        # An earlier image's .debs only save downloads on the online path below.
        restore-keys: ${{ steps.key.outputs.prefix }}
    - id: install
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_TIMEOUT: ${{ inputs.timeout-seconds }}
        APT_PRIMARY_TIMEOUT: ${{ inputs.primary-timeout-seconds }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: ${{ github.action_path }}/install.sh
    - if: ${{ steps.install.outputs.collected == 'true' && steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/apt-archives
        key: ${{ steps.key.outputs.exact }}
