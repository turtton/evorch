[profile.default]
fail-fast = false
retries = 0
test-threads = 4

# ハング検知はテスト内の壁時計ではなくランナー側に集約する。
# 共有 CI ランナーの負荷で正当なテストが遅延しても失敗にしないため
# period を大きく取り、その後の terminate のみを担う。
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "30s" }

# crates/evorch-core/tests/core_expiry: a cell's own failure backstops end at 180s
# and its controller then cleans up for up to 30s, so the runner must not
# terminate before that (it would cut cleanup short). Only this binary.
[[profile.default.overrides]]
filter = 'binary(=core_expiry)'
slow-timeout = { period = "240s", terminate-after = 1, grace-period = "30s" }

# crates/evorch-core/tests/core_browser_expiry: a cell's whole-cell failure watchdog is
# 300s, then controller cleanup (30s) and a 5s runtime shutdown bound.
[[profile.default.overrides]]
filter = 'binary(=core_browser_expiry)'
slow-timeout = { period = "420s", terminate-after = 1, grace-period = "30s" }

# The ignored display measurements (crates/core-client-e2e/tests/display_measure.rs) include a
# 30-minute soak; run them with `-P measure`. Hang detection stays with the runner.
[profile.measure]
inherits = "default"
slow-timeout = { period = "1800s", terminate-after = 3, grace-period = "60s" }

# CI benchmark (DO NOT MERGE): per-test timings of the CI shards.
[profile.ci-m2.junit]
path = "junit.xml"
