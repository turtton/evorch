[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
dom_smoothie = "0.18"
# v01 GUI dependencies pinned for the workspace UI and GUI crates.
eframe = "0.36"
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui_kittest = { version = "0.36", features = ["wgpu"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
flate2 = "1"
getrandom = "0.3"
hickory-resolver = { version = "0.25", features = ["system-config", "tokio"] }
htmd = "0.5.5"
image = { version = "0.25", default-features = false, features = ["png"] }
ipnet = "2"
jsonschema = { version = "0.52", default-features = false }
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "vendored"] }
# OTel metrics / span exporter (event-bus / otel-exporter feature)。
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rcgen = "0.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = { version = "0.27", features = ["atomic"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-rustls = "0.26"
# Used by workspace-ui for development-time configuration serialization.
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
wiremock = "0.6"
