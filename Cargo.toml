[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["file_chooser", "tokio"] }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
dom_smoothie = "0.18"
# v01 GUI dependencies pinned for the workspace UI and GUI crates.
eframe = "0.36"
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui_kittest = { version = "0.36", features = ["wgpu"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
flate2 = "1"
getrandom = "0.3"
hickory-resolver = { version = "0.25", features = ["system-config", "tokio"] }
htmd = "0.5.5"
image = { version = "0.25", default-features = false, features = ["png"] }
ipnet = "2"
jsonschema = { version = "0.52", default-features = false }
keyring = { version = "4", features = ["v1"] }
# OTel metrics / span exporter (event-bus / otel-exporter feature)。
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rcgen = "0.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = { version = "0.27", features = ["atomic"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-rustls = "0.26"
# Used by workspace-ui for development-time configuration serialization.
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wiremock = "0.6"

# --- Dev-build bloat mitigation ---
# Full debuginfo across the ~704-crate dep tree (wgpu/egui stack) produced
# ~750MB test binaries and 200G+ target dirs. Strip dependency debuginfo
# entirely and keep only line tables for workspace crates, so backtraces and
# panic messages keep file:line for OUR code (dep frames keep symbols only).
# The main `ci` job forces CARGO_PROFILE_DEV_DEBUG=0 / CARGO_PROFILE_TEST_DEBUG=0
# (env overrides this manifest); other CI jobs (offscreen-gate, browser-e2e)
# pick up this slimmer profile, which only reduces their disk/link load.
# Tradeoff: variable inspection in a debugger needs the escape-hatch profile below.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Escape hatch for debugger sessions (gdb/lldb with variable inspection):
#   cargo build --profile debugging
#   cargo test  --profile debugging
# NOTE: package overrides are inherited from dev, so the dep override must be
# re-specified here — `debug = true` on [profile.debugging] alone would still
# strip dep debuginfo.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
