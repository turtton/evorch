# Font parsing/shaping and software rasterization dominate unoptimized GUI
# tests and evidence capture. Level 1 speeds these hot paths without optimizing
# the entire dependency graph. The test profile inherits these dev overrides.
# Keep these in Cargo config: rust-cache hashes this file even in a virtual
# workspace, where the root Cargo.toml is absent from its member-manifest hash.
[build]
# Keep compilation from saturating a shared host when several worktrees build.
# Individual commands may override this with --jobs or CARGO_BUILD_JOBS.
jobs = 4

[env]
# cargo test uses libtest's own thread pool, separate from build.jobs.
RUST_TEST_THREADS = "4"

[profile.dev.package.epaint]
opt-level = 1
debug = false

[profile.dev.package.harfrust]
opt-level = 1
debug = false

[profile.dev.package.skrifa]
opt-level = 1
debug = false

[profile.dev.package.read-fonts]
opt-level = 1
debug = false

[profile.dev.package.vello_cpu]
opt-level = 1
debug = false

# Named overrides take precedence over "*" and are inherited from dev too.
# Restore unoptimized code and full debuginfo for debugger variable inspection.
[profile.debugging.package.epaint]
opt-level = 0
debug = true

[profile.debugging.package.harfrust]
opt-level = 0
debug = true

[profile.debugging.package.skrifa]
opt-level = 0
debug = true

[profile.debugging.package.read-fonts]
opt-level = 0
debug = true

[profile.debugging.package.vello_cpu]
opt-level = 0
debug = true
