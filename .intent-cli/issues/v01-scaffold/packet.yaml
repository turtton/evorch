implementation_issue_packet:
  issue_title: "v0.1: Cargo workspace・crate 骨格・nix devShell・CI を整備する"
  issue_kind: feature
  source_execution_unit: v01-scaffold
  domain: evorch
  target_repo: turtton/evorch
  target_path: "Cargo.toml, crates/, flake.nix, rust-toolchain.toml, .github/workflows/ci.yml"
  target_part: "Rust workspace の初期構成と開発基盤"
  dependencies: []
  technical_baseline:
    - "Rust 実装は未存在（Cargo.toml / crates/ / rust-toolchain.toml / .github/workflows/ はいずれも未作成）"
    - "flake.nix / flake.lock / .envrc / .gitignore は既存。devShells.default は bashInteractive + intent-cli のみで Rust toolchain 未含"
    - "architecture.md の「Rust Workspace 構成案（crates/）」は構成案であり、v0.1 初期 crate セットは本 slice で ADR 0016 として確定する"
    - "前提として ADR 0007（GUI は egui + egui_dock）/ ADR 0014（config アーキテクチャ）/ ADR 0015（検証2層運用）が採択済み"
  intent_references:
    - "intents/evorch/technology/architecture.md"
    - "intents/evorch/technology/mvp-roadmap.md"
  acceptance_criteria:
    - "crates/ 配下に v0.1 crate セットの骨格（Cargo.toml + src/lib.rs、バイナリ crate は src/main.rs）が存在する: runtime / event-bus / storage / providers / tools / sandbox / routing / model / config / gui / evorch（バイナリ）"
    - "ルート Cargo.toml が virtual workspace として crates/* を member に持ち、`cargo build --workspace` が通る"
    - "`cargo test --workspace` が通る"
    - "`cargo clippy --workspace -- -D warnings` が通る"
    - "`cargo fmt --check` が workspace 全体で通る"
    - "rust-toolchain.toml で toolchain channel と components（rustfmt / clippy）が固定されている"
    - "flake.nix の devShell に Rust toolchain（cargo / rustfmt / clippy）が追加され、`nix develop` でシェルが立ち上がり `cargo build` が実行できる"
    - ".github/workflows/ci.yml が fmt --check / clippy -D warnings / test を実行する"
    - "crate 分割の初期粒度を確定し、ADR 0016 として host に記録する"

