implementation_issue_packet:
  issue_title: "v0.1: 型付き Event Bus（event stream）コアを実装する"
  issue_kind: feature
  source_execution_unit: v01-event-stream
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/event-bus/"
  target_part: "Agent Kernel のイベントバックボーン"
  dependencies:
    - v01-scaffold
  technical_baseline:
    - "v01-scaffold で crate 骨格が存在し workspace がビルド可能であること"
    - "ADR 0012 で計測語彙（OTel Metrics API）・bounded ring buffer による raw 保持・downsampled 保存・TTFT/throughput 自動集計が決定済み"
    - "architecture.md の Open questions「Event Bus の transport 実装」は本 slice で ADR 0017 として確定する"
    - "Async runtime は Tokio（技術スタック確定）"
  intent_references:
    - "intents/evorch/technology/architecture.md"
    - "intents/evorch/features/agent-runtime-kernel/overview.md"
    - "intents/evorch/decisions/0012-metrics-architecture.md"
  acceptance_criteria:
    - "agent-runtime-kernel の event-driven 設計に基づく具象 event 型（lifecycle / message / tool call / token usage / provider request-response / fault の各カテゴリ）を定義し、emit した event を複数 subscriber が受信できる"
    - "in-process transport は tokio broadcast channel ベースとし、subscriber が追従できない場合の挙動（Lagged 検知と drop ポリシー）が定義され、fault event + tracing warning として表面化する"
    - "全 event 型が serde の serialize / deserialize round-trip を通る"
    - "token usage / TTFT 計測に必要な timestamp（monotonic + wall-clock）フィールドが event schema に含まれる"
    - "ADR 0012 の bounded ring buffer による raw 保持（最古 drop）の実装が event-bus に含まれる"
    - "transport を in-process のみに確定し、理由と将来拡張方針を ADR 0017 として host に記録する"

