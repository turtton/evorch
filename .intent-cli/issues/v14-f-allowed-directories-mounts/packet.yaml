    - intents/evorch/features/tools-sandbox/overview.md
  new_intent_needed: false
  placement_rationale: "ADR 0032 の「対象は trust 済みの許可ディレクトリだけ」「アクセス権は role に従う」節の実装。プロンプトへの記載（v14-g）と指示ファイルの読み込み（v14-h）の前提になる"
