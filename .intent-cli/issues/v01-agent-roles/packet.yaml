implementation_issue_packet:
  issue_title: "v0.1: Orchestrator / Explorer / Worker / Reviewer の role 実行と background agent を実装する"
  issue_kind: feature
  source_execution_unit: v01-agent-roles
  domain: evorch
  target_repo: turtton/evorch
  target_path: crates/runtime/, crates/agents/
  target_part: "AgentRun・role capability boundary・background 実行"
  dependencies:
    - v01-event-stream
    - v01-session-storage
    - v01-provider-client
    - v01-tool-layer
    - v01-sandbox-approval
  technical_baseline:
    - "v01-scaffold により crates/runtime/ と crates/agents/ が空 crate として Scaffold 済みであること"
    - "v01-event-stream が EventBus と AgentEvent（Started / MessageDelta / ToolStarted / Completed / Failed / BackgroundTaskStarted / BackgroundTaskCompleted 等）の送受信 API を提供すること"
    - "v01-session-storage が SQLite による session / AgentRun / task の永続化 API を提供すること"
    - "v01-provider-client が ProviderProfile 抽象とプロバイダ呼び出し API を提供すること"
    - "v01-tool-layer が tool trait と read / edit / grep / shell / git diff 等の実装を提供すること"
    - "v01-sandbox-approval が批准 permission 判定を提供し、tool 実行時の承認要求を決定すること"
  intent_references:
    - intents/evorch/features/orchestration/overview.md
    - intents/evorch/features/agent-runtime-kernel/overview.md
    - intents/evorch/decisions/0002-role-capability-boundaries.md
    - intents/evorch/technology/mvp-roadmap.md
  acceptance_criteria:
    - "Orchestrator / Explorer / Worker / Reviewer の4 role が ADR 0002 の capability boundary で分離され、runtime レベルで許可 tool セット・network 扱いが role ごとに強制される（Orchestrator に write / edit / apply_patch / arbitrary shell / git commit が無く、Explorer に write / edit / delegate が無い等）"
    - "各 role の capability boundary がユニットテストで検証できる（tool 権限の許可/拒否と network 既定 deny の検査）"
    - "AgentRun が event-sourced に状態遷移（pending / running / waiting / done / error）を event stream へ emit する"
    - "background 起動した AgentRun が GUI 無しに継続し、背景タスクの開始・完了・キャンセルが event として観測できる"
    - "各 AgentRun が独立した agent context を持ち、複数 agent が Tokio task として同時に並行動作する"
    - "Orchestrator が delegate / delegate_background / send_message / wait / cancel を持つ背景起動型の振る舞いを見せる"
    - "Librarian / Oracle（v0.2 追加 role）が既存の capability boundary 機構への role 定義追加で拡張できることが実装構造で示される"
    - "role → model の対応とフォールバックは v01-routing-profiles に委譲し、本 packet ではルーティングを自前実装しない"

