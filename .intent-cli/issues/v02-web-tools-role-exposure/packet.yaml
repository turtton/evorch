implementation_issue_packet:
  issue_title: "v0.2: web ツールを role 別に公開する（Librarian=search+fetch / Orchestrator=fetch のみ OptIn）"
  issue_kind: feature
  source_execution_unit: v02-web-tools-role-exposure
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/agents/ crates/runtime/ crates/tools/"
  target_part: "role capability と production tool registry を更新し、実装済みの web_search / web_fetch を Librarian（両方）および Orchestrator（fetch のみ OptIn）に公開する consumer 配線 slice。policy の model-visible filter と executor 登録、tripwire テストの非対称更新を含む"
  dependencies: [v02-web-search-tool, v02-web-fetch-tool]
  technical_baseline:
    - "web_search / web_fetch は v0.2 で crates/tools に実装済み（issue #43 / #45、 Exa keyless 既定 + Tavily fallback、readability chain + 5MB/50KB 切詰め）"
    - "ToolExecutor::with_standard_tools() は現状 read / edit / grep / shell / git_diff のみ登録（crates/tools/src/executor.rs）"
    - "production agent loop の model-visible spec は crates/runtime/src/agent_loop/tool_calls.rs の standard_tool_specs() で、3 層 AND の layer-1 は crates/runtime/src/policy.rs の role filter"
    - "role capability は crates/agents/src/role.rs（Role::capabilities() / NetworkAccess::{Denied,OptIn,Allowed}）"
    - "runtime tripwire test: crates/runtime/tests/web_search_network_gate.rs / web_fetch_network_gate.rs、capability_enforcement.rs"
    - "ContentOrigin 型付けは ToolExecutor の結果正規化層で fail-closed 機械導出（tool 自己申告不可）"
  intent_references:
    - intents/evorch/features/tools-sandbox/overview.md
    - intents/evorch/decisions/0002-role-capability-boundaries.md
    - intents/evorch/decisions/0008-threat-model-phased-adoption.md
    - intents/evorch/interviews/web-tools-v02.json
  acceptance_criteria:
    - "crates/agents/src/role.rs で Librarian は web_search と web_fetch を許可、NetworkAccess=Allowed とする"
    - "Orchestrator は web_fetch のみ許可し、NetworkAccess=OptIn（承認なしでは拒否）とする。web_search は Orchestrator からは非公開のままとする"
    - "crates/runtime/src/agent_loop/tool_calls.rs の standard_tool_specs() に web_search / web_fetch を登録し、policy 層の role filter で上記非対称が適用される"
    - "crates/tools/src/executor.rs の with_standard_tools()（または production composition root 側の等価経路）に web_search / web_fetch を登録し、本番 agent loop で到達可能にする"
    - "tripwire テスト web_search_network_gate.rs / web_fetch_network_gate.rs を非対称公開へ更新（Librarian=両方許可、Orchestrator=fetch のみ OptIn、Explorer/Worker/Reviewer では拒否）"
    - "Orchestrator の web_fetch 実行が session NetworkAccess=OptIn の approval を経由することを検証する runtime テストがある"
    - "ContentOrigin::WebUntrusted が ToolExecutor で fail-closed に維持される回帰テストがある"
    - "cargo test / cargo clippy -- -D warnings / cargo fmt --check / git diff --check が pass する"

