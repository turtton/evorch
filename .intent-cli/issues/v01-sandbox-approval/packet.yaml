implementation_issue_packet:
  issue_title: "v0.1: sandbox + approval 二層セキュリティと credential 隔離・network deny を実装する"
  issue_kind: feature
  source_execution_unit: v01-sandbox-approval
  domain: evorch
  target_repo: turtton/evorch
  target_path: crates/sandbox/
  target_part: "実行ポリシー・sandbox 実行・承認フロー・credential 隔離"
  dependencies: [v01-scaffold, v01-tool-layer, v01-event-stream]
  technical_baseline:
    - "Rust + Tokio async runtime（architecture.md）"
    - "bubblewrap（bwrap、Linux sandbox 第一実装。本 slice 冒頭で ADR 化して確定）"
    - "serde / serde_json（policy 記述と結果正規化）"
    - "tracing（構造化ログ）"
    - "keyring / 0600 平文 JSON fallback（credential 隔離。ADR 0008）"
  intent_references:
    - intents/evorch/features/tools-sandbox/overview.md
    - intents/evorch/decisions/0008-threat-model-phased-adoption.md
    - intents/evorch/technology/mvp-roadmap.md
  acceptance_criteria:
    - "approval 層が tool 実行を policy で分類し、auto-allow / ask / deny を適用。ask は GUI/CLI の承認応答を待ってから実行する"
    - "deny された操作は実行されない（拒否が観測可能なイベントとして emit される）"
    - "credential ファイル・env を sandbox 子プロセスから参照できないことをテストで検証する（env は credential を除去、ファイルは sandbox 外に置く）"
    - "network egress が既定 deny で、provider endpoint のみ allowlist を通ることをテストで検証する"
    - "dangerous 操作が Linux sandbox（bwrap）で実行され、承認しても sandbox 外では実行されない（二層分離）"
    - "Landlock vs bwrap の選択結果が ADR 0017 として記録されている"

