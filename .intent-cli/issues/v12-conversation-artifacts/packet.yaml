    - intents/evorch/features/orchestration/overview.md
  new_intent_needed: false
  placement_rationale: "ADR 0029 と feature の要件追記（commit 7f8f0ba4）で方針は記録済み。Phase 1 は ADR の段階 1 に HTML の外部表示（スナップショットなし）を加えた最小の縦切りであり、新しい intent は不要"
