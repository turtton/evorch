implementation_issue_packet:
  issue_title: "v0.2: AGENTS.md ネスト closest-wins 注入と tool 実行後 synthetic message 注入（scoped rules / dynamic truncation）を実装"
  issue_kind: feature
  source_execution_unit: v02-project-rules
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/runtime/ crates/config/"
  target_part: "プロジェクト rules 注入層。AGENTS.md のネスト closest-wins（ルート→深い階層順の複数注入）、起動時はルート + user スコープのみ、read / edit tool 実行後の対象ファイル最寄り rules 収集と synthetic message 注入、scoped rules dirs（.omo/rules / .claude/rules / .cursor/rules / .github/instructions）の alwaysApply / glob 解決、dynamic truncation"
  dependencies: [v02-prompt-assembly]
  technical_baseline:
    - "Rust 1.97 / edition 2024 + Tokio async runtime（workspace Cargo.toml）"
    - "v02-prompt-assembly が確立する prompt assembly 層 — 起動時ルート + user スコープ注入の接続先。現行 runtime は system prompt 合成を持たず（crates/runtime/src/agent_loop.rs の run_agent は task prompt を user message として push するのみ）"
    - "AgentContext（crates/runtime/src/context.rs:18 — messages: Vec<Message>、run task が独占所有）と push_tool_result（同 file:56 — tool 結果は user role + ToolResult content block で積まれる）— synthetic 注入 part を組み込む model-visible messages の実体"
    - "ToolExecutor 標準 5 ツール（read / edit / grep / shell / git_diff、crates/tools/src/executor.rs:92 with_standard_tools）— read / edit が対象パスを持つ trigger tool。hook は tool 実行結果の経路で行い、ToolExecutor の sandbox / 承認 / 制御マーカーエスケープ契約は変更しない"
    - "Message / ContentBlock（crates/providers/src/message.rs、ADR 0020 canonical message normalization）— synthetic part は canonical 形式の text part として model-visible messages に組み込む"
    - "workspace_root（crates/runtime/src/runtime.rs production() の構築引数）— AGENTS.md / rules 発見の基準点。project root の目印は evorch.toml（crates/config/src/load.rs PROJECT_MAIN_FILE）"
    - "omo 参照実装（oh-my-openagent 4.19.4、dist/index.js）: findAgentsMdUp()（:91230 — 対象ファイル dir から親方向探索、found.reverse() でルート→深い階層順に複数注入）+ context injector（:135044 — 最後の user message text part の前に synthetic part 挿入）+ dynamic truncator（64KiB cache 上限）"
    - "ADR 0003 / context-engine overview の Stable Prefix 要件（project instruction snapshot）— 起動時ルート注入を snapshot 対象と接続する（snapshot 化の本実装は v0.2 scope 外、注入内容の決定論性のみ担保）"
  intent_references:
    - intents/evorch/features/agent-runtime-kernel/overview.md
    - intents/evorch/features/context-engine/overview.md
    - intents/evorch/decisions/0003-cache-first-context-engine.md
    - intents/evorch/interviews/grill-v02-loop-foundation.json
  acceptance_criteria:
    - "ネスト AGENTS.md: read / edit 実行後、対象ファイルのディレクトリから親方向へ AGENTS.md を探索し、ルート→深い階層順（closest wins、深い側が後勝ち）で全該当分が model-visible messages に synthetic 注入されることを unit test で検証（fixture repo で 2 階層以上のネスト）"
    - "run 開始時はルート AGENTS.md + user スコープのみを注入し、深い階層の AGENTS.md を読まないことを unit test で検証"
    - "対象ファイルに最寄り AGENTS.md / 該当 rules が存在しない場合、空の synthetic message を積まないことを unit test で検証"
    - "scoped rules dirs（.omo/rules / .claude/rules / .cursor/rules / .github/instructions）を alwaysApply / glob メタデータ付きで解決し、alwaysApply は該当 scope で常時注入、glob 指定は対象ファイルが glob に一致した場合のみ注入されることを unit test で検証"
    - "dynamic truncation: 注入量が上限（実装 slice で確定、既定値は unit test で固定）を超える場合、末尾 truncate して上限内に収めることを unit test で検証"
    - "synthetic 注入は model への request 時点の messages 組み立てにのみ影響し、storage の event log / message repo に記録される transcript を改変しないことを unit test で検証"
    - "既存 5 標準ツール・ToolExecutor 契約（jsonschema 引数検証 / 承認 / 制御マーカーエスケープ / ToolStarted / ToolCompleted）に回帰がないこと"
    - "cargo test / cargo clippy -- -D warnings / cargo fmt --check / git diff --check が pass する"

