closeout_learning:
  expected: |
    画像添付 UX の実装で、クリップボード連携・thumbnail 配置・modal 拡大表示のベストプラクティスを
    蓄積。provider Vision API との統合 (Anthropic image / OpenAI vision フォーマットの差異) も記録。
  write_back_required: true
  write_back_targets:
    - intents/evorch/features/gui-workbench/overview.md
