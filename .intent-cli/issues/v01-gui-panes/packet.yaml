implementation_issue_packet:
  issue_title: "v0.1: egui + egui_dock 基本 pane（agent / terminal / tasks）を実装する"
  issue_kind: feature
  source_execution_unit: v01-gui-panes
  domain: evorch
  target_repo: turtton/evorch
  target_path: crates/gui/, crates/workspace-ui/
  target_part: "GUI アプリ・workspace model・基本 pane"
  dependencies:
    - v01-agent-roles
    - v01-event-stream
    - v01-session-storage
  technical_baseline:
    - "v01-scaffold により crates/gui/ と crates/workspace-ui/ が空 crate として Scaffold 済みであること"
    - "v01-agent-roles が AgentRun・role capability boundary・background agent 実行を提供し、AgentRun 一覧と状態遷移が event として観測できること"
    - "v01-event-stream が EventBus と AgentEvent の subscribe API（transcript の message / reasoning / tool 実行）を提供すること"
    - "v01-session-storage が永続化された session / AgentRun の参照 API を提供すること"
  intent_references:
    - intents/evorch/features/gui-workbench/overview.md
    - intents/evorch/decisions/0007-gui-framework-egui-first.md
    - intents/evorch/decisions/0009-platform-linux-first-gui-only.md
    - intents/evorch/technology/mvp-roadmap.md
  acceptance_criteria:
    - "egui + egui_dock（anhosh/egui_dock 0.21.x）で agent / terminal / tasks の基本3 pane が表示でき、dock / undock / resize / tab 移動・floating window が動作する"
    - "Agent Kernel → UI Event Bus → Workspace Model → GUI Renderer の層構造を守り、Workspace Model が crates/workspace-ui/ に framework 非依存データ（Split / Tabs / Panel / Floating / Window）として保持され、GUI 無しに layout を検証・保存できる"
    - "agent pane が event stream の transcript（message / reasoning / tool 実行）を描画する"
    - "terminal pane が portable-pty で PTY を生成・操作できる"
    - "tasks pane が AgentRun 一覧（name / role / status / model 等）を表示し、v01-agent-roles の背景タスク状態と連動する"
    - "offscreen レンダリング（ADR 0009）でフレームを capture でき、ヘッドレス起動できる"
    - "panel layout・keybind が config 公開される（ADR 0014 の v0.1 設定領域）"
    - "semantic UI の introspection（v0.5）と Cost / Cache Inspector・Diagnostics 等の高度 pane（v0.2 以降）は実装しないことが明示される"

