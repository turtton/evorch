implementation_issue_packet:
  issue_title: "v0.1: SQLite session 永続化と entity schema を実装する"
  issue_kind: feature
  source_execution_unit: v01-session-storage
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/storage/"
  target_part: "session / task / message / agent_run / event の永続化"
  dependencies:
    - v01-scaffold
    - v01-event-stream
  technical_baseline:
    - "v01-scaffold で workspace 骨格、v01-event-stream で event schema / ring buffer / in-memory 観測の土台が存在する"
    - "ADR 0012 で SQLite 運用ポリシー（synchronous=NORMAL / wal_autocheckpoint / 定期 PASSIVE checkpoint / ハード上限 / 自己参照防止 / 起動時安全検査）と single-writer + downsampled 保存が決定済み"
    - "ADR 0008 で credential 隔離方針が決定済み（storage に credential を永続化しない）"
    - "architecture.md は Storage を「SQLite」とだけ記載しており、アクセス層（rusqlite / sqlx 等）の選択は本 packet で確定する"
  intent_references:
    - "intents/evorch/features/storage-memory/overview.md"
    - "intents/evorch/technology/architecture.md"
    - "intents/evorch/decisions/0012-metrics-architecture.md"
    - "intents/evorch/decisions/0008-threat-model-phased-adoption.md"
  acceptance_criteria:
    - "migration 適用により sessions / tasks / messages / agent_runs / events / downsampled_metrics の各テーブルが作成される"
    - "session / task / message / agent_run / event の CRUD が動く"
    - "プロセス再起動後に session が復元できる（event log → state projection の再現）"
    - "ADR 0012 の WAL 運用（synchronous=NORMAL / wal_autocheckpoint / 定期 PASSIVE checkpoint）とハード上限（DB・WAL・event サイズ等）が PRAGMA 初期化および設定として実装されている"
    - "raw 高頻度計測イベントは直接永続化せず、single-writer + バッチ flush で downsampled_metrics（1分バケット per provider/model）のみ書き込む経路がある"
    - "downsampled_metrics テーブル（1分バケット per provider/model）の定義がある"
    - "credential（API key 等）が storage に書き込まれないこと（ADR 0008）を型 / テストで保証する"

