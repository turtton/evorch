implementation_issue_packet:
  issue_title: "v0.1: provider 抽象と OpenAI / Anthropic / OpenAI-compatible ストリーミングクライアントを実装する"
  issue_kind: feature
  source_execution_unit: v01-provider-client
  domain: evorch
  target_repo: turtton/evorch
  target_path: crates/providers/
  target_part: "provider trait・メッセージ変換・API クライアント"
  dependencies: [v01-scaffold, v01-event-stream]
  technical_baseline:
    - "Rust + Tokio async runtime（architecture.md）"
    - "reqwest（HTTP / SSE ストリーミング）"
    - "serde / serde_json（wire 形式変換）"
    - "tracing（構造化ログ）"
    - "wiremock（dev-dependency。ADR 0015 第1層の mock 契約テスト）"
  intent_references:
    - intents/evorch/features/provider-routing/overview.md
    - intents/evorch/technology/re-evaluation-2026-08.md
    - intents/evorch/decisions/0004-provider-routing-separation.md
    - intents/evorch/technology/mvp-roadmap.md
  acceptance_criteria:
    - "統一 ProviderClient trait（send / stream）を OpenAI / Anthropic / OpenAI-compatible の3実装が実装し、ProviderCapabilities を返す"
    - "provider 非依存の canonical Message 正規化と wire 形式変換を持ち、OpenAI ↔ Anthropic の round-trip テストで検証できる"
    - "mock HTTP server（wiremock、recorded response fixture）で SSE ストリーミング応答の parse・delta 結合が検証される（ADR 0015 第1層）"
    - "tool call が provider 別 wire 形式から canonical tool_call へ変換される"
    - "Usage（input / output / cache read / cache write token 数）が parse され、event stream へ usage イベントとして emit される（ADR 0012 の入力）"
    - "HTTP 4xx/5xx・429（Retry-After）・timeout・不正 SSE に対して typed error を返す"

