implementation_issue_packet:
  issue_title: "v0.7 E2: team mode（opt-in、Coordinated(DynamicTeam) の最小実装）"
  issue_kind: feature
  source_execution_unit: v07-e2-team-mode
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/runtime/src/team/*.rs crates/runtime/src/claim.rs crates/runtime/src/registry.rs crates/runtime/src/team_task_queue.rs crates/runtime/src/artifact_ownership.rs crates/gui/src/panes/team.rs crates/gui/src/panes/claim_prompt.rs"
  target_part: "複数エージェントでの並列実行・役割分担を有効化する。ただし固定 leader/member workflow ではなく、capability role と ownership/claim/lease の最小機構で実装する"
  dependencies:
    - "v0.6 Bundle B の role capability 追加がある前提"
  technical_baseline:
    - "role capability / DelegationValue / Execution Shape は既存"
    - "ADR 0001 の no-fixed-workflow を維持"
    - "runtime event sourcing / queue は既存"
  intent_references:
    - "intents/evorch/features/orchestration/overview.md"
    - "intents/evorch/decisions/0001-no-fixed-workflow.md"
    - "intents/evorch/features/gui-workbench/overview.md"
  acceptance_criteria:
    - "ExecutionShape::Coordinated(DynamicTeam) を選択できる"
    - "capability role を用いて最小 3 worker までの team を構成できる"
    - "atomic task claim と lease / heartbeat で同一 artifact の衝突を防げる"
    - "failure recovery が GUI の team pane で可視化される"
    - "単一 agent を超える並列価値があることを GUI で確認できる"

intent_placement:
  primary_intent: intents/evorch/features/orchestration
  supporting_intents:
    - intents/evorch/features/gui-workbench
    - intents/evorch/features/agent-runtime-kernel
  new_intent_needed: false
  placement_rationale: |
    team mode は orchestration の実行形状として実装する。GUI は task queue と agent status を可視化する。
