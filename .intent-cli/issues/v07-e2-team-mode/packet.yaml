    summary: ""
closeout_learning:
  expected: |
    Anthropic / DeLM / AgentRoom / BenchAgent の調査結果を踏まえ、固定 workflow を避けた team mode の最小実装を
    evorch に組み込む。capability role による専門分解と failure recovery を優先する。
  write_back_required: true
  write_back_targets:
    - intents/evorch/features/orchestration/overview.md
