closeout_learning:
  expected: |
    browser visibility の調査結果（agent-browser / browser-relay / CEF / servo）を踏まえ、evorch の GUI に
    埋め込みの browser pane を opt-in で導入する。headless 可視化の仕組みを diagnostics と関連付ける。
  write_back_required: true
  write_back_targets:
    - intents/evorch/features/gui-workbench/overview.md
