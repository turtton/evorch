implementation_issue_packet:
  issue_title: "v09-b: 完了通知駆動のバックグラウンド run 実行モデルを実装"
  issue_kind: feature
  source_execution_unit: v09-b-background-run-notifications
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/runtime/ crates/event-bus/ crates/gui/"
  target_part: "run をバックグラウンドで fire-and-forget 実行し、完了・失敗・承認待ちを event 駆動の通知として GUI に surface するモデル（orchestrator/ユーザーはポーリングせず通知で起きる）"
  dependencies: []
  technical_baseline:
    - "実証済みの動機（2026-09-12 wave）: 最大5タスクの並列 background 実行 + 完了 notification で orchestrator がポーリングなしに捌けた。ポーリングモデルはトークン効率・応答性ともに劣る"
    - "EventBus（crates/event-bus）は schema_version 付き envelope で RequestCompleted 等の run 終端 event が既存。通知の原料は揃っている"
    - "F8 で入れた AttentionAck モデル（crates/gui/src/model/ack.rs、未読=強調・既読=枠のみ、displayed+focused+revision 一致で ack）は通知の既読管理にそのまま再利用できる"
    - "現状の GUI はフォアグラウンドの chat 送信が中心で、複数 run の並行状態を一覧する surface は薄い"
    - "v07-e2-team-mode の team pane 計画と表示を統合できると望ましいが、本 unit は単発 run の通知モデルを先に成立させる"
  intent_references:
    - intents/evorch/features/gui-workbench/overview.md
    - intents/evorch/features/orchestration/overview.md
    - intents/evorch/decisions/0017-event-bus-transport.md
    - intents/evorch/decisions/0025-agent-experience-evaluation.md
  acceptance_criteria:
    - "run をバックグラウンドで開始でき、開始元の chat/GUI 操作をブロックしない"
    - "run の完了・失敗・承認待ちが通知として未読強調表示され、表示+focus で既読になる（ack モデル再利用）"
    - "通知から該当 run の transcript へ1操作で遷移できる"
    - "進行中 run の一覧と状態（実行中/待機/完了/失敗）が GUI で確認できる"
    - "回帰テスト: 通知の未読/既読遷移、通知からの遷移、複数 run 同時進行時の表示"
