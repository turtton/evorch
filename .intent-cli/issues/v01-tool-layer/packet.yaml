implementation_issue_packet:
  issue_title: "v0.1: tool 基盤と read / edit / grep / shell / git_diff ツールを実装する"
  issue_kind: feature
  source_execution_unit: v01-tool-layer
  domain: evorch
  target_repo: turtton/evorch
  target_path: crates/tools/
  target_part: "tool trait・標準ツールセット"
  dependencies: [v01-scaffold, v01-event-stream]
  technical_baseline:
    - "Rust + Tokio async runtime（architecture.md）"
    - "portable-pty（shell ツールの PTY 実行）"
    - "tokio::process::Command（非 interactive な通常 command。Shell/PTY 分離）"
    - "serde / serde_json（JSON Schema 記述と結果正規化）"
    - "tracing（構造化ログ）"
  intent_references:
    - intents/evorch/features/tools-sandbox/overview.md
    - intents/evorch/technology/mvp-roadmap.md
    - intents/evorch/technology/architecture.md
  acceptance_criteria:
    - "統一 Tool trait（name / schema / execute / 結果正規化）を定義し、read / edit / grep / shell / git_diff の5標準ツールが実装する"
    - "各ツールが JSON Schema を返し、モデルからの tool call 引数に対して検証できる"
    - "read / grep が存在しない path に typed error を返す"
    - "edit が一時ファイル + rename で atomic に書き込み、ADR 0008 の制御マーカー（<system-reminder> 等）エスケープを tool result へ適用する"
    - "shell が非 interactive は tokio::process::Command、interactive は portable-pty で擬端末実行する（Shell/PTY 分離）"
    - "git_diff が working tree の diff を返す"
    - "tool 実行結果が event stream へ emit される（v01-event-stream の tool_result イベントへ接続）"

