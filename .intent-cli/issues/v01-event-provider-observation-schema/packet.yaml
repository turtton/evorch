  adr:
    required: false
    target_paths: []
    decision_title: "なし。transport/versioning は ADR 0017、routing separation は ADR 0004 で決定済み。本 packet は不足 schema と measurement contract の具体化。"
  diagram:
    required: false
    target_paths: []
    diagram_type: none
  docs:
    required: true
    target_paths:
      - intents/evorch/features/provider-routing/overview.md
      - intents/evorch/features/diagnostics-self-improvement/overview.md
    summary: "request start → first observable token → completed/error/fallback の event sequence と TTFT 定義を記録する。"
closeout_learning:
  expected: "provider 3実装で共通化できた attempt lifecycle の発行境界、request ID の生成・伝播方法、TTFT first-token 判定、UsageEvent と completion event の token accounting 関係を intent に書き戻す。"
  write_back_required: true
  write_back_targets:
    - intents/evorch/features/provider-routing/overview.md
    - intents/evorch/features/diagnostics-self-improvement/overview.md
