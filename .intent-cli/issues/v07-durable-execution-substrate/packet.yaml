implementation_issue_packet:
  issue_title: "Durable execution substrate: 中断・再開・検証可能な長時間 agent 実行"
  issue_kind: feature
  source_execution_unit: v07-durable-execution-substrate
  domain: evorch
  target_repo: turtton/evorch
  target_path: crates/runtime,crates/gui,crates/event-bus
  target_part: "GoalSupervisor・OrchestratorEvent・event replay・ReviewLoop の拡張として、durable task continuation / budget & circuit breaker / evidence-first verification gate を実装する"
  dependencies: []
  technical_baseline:
    - "crates/runtime/src/orchestration/review.rs:83 (bounded ReviewLoop)"
    - "OrchestratorEvent::GoalCreated (thread_id, root_run_id)"
    - "crates/gui/src/runtime_sink.rs (goal submit/binding)"
    - "crates/event-bus/src/event.rs:143 (DiagnosticEvent)"
  intent_references:
    - "intents/evorch/features/orchestration/overview.md"
    - "intents/evorch/features/agent-runtime-kernel/overview.md"
  acceptance_criteria:
    - "task_id 指定で中断後の goal を resume でき、成果物・失敗理由・再開地点が永続化されていること"
    - "tool-call 数・時間・token 等の予算超過時に DiagnosticEvent (BudgetExhausted/NoProgress/ProviderUnavailable) が発行され、checkpoint が 50-call ごとに発火すること"
    - "spawn 前に provider/model が解決・疎通確認され、未検証 fallback で worker が起動しないこと"
    - "ReviewLoop の verdict が typed tool result (criterion + evidence 紐付け) で返されること"
    - "既存 gui/providers/event-bus/runtime のテストが回帰しないこと"

