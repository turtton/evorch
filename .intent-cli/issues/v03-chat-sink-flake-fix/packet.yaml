implementation_issue_packet:
  issue_title: "v0.3: chat_sink_runtime flake 根治（second_chat_reuses_same_run_and_run_survives_resume 非決定失敗）"
  issue_kind: bug
  source_execution_unit: v03-chat-sink-flake-fix
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/gui/ crates/runtime/"
  target_part: "crates/gui/tests/chat_sink_runtime.rs:140 second_chat_reuses_same_run_and_run_survives_resume の非決定的失敗の根治。PR #92 由来の pre-existing flake。wait_for_reply で 5 秒 timeout 内に MessageDelta + Waiting イベント列を受信するが、高負荷時に event 到達順序または run の状態復帰（resume）に timing 依存があるものと推定"
  dependencies: []
  technical_baseline:
    - "crates/gui/tests/chat_sink_runtime.rs:171 second_chat_reuses_same_run_and_run_survives_resume が fail / rerun pass を繰り返す（PR #94 push run、main revert run で複数回観測）"
    - "wait_for_reply は tokio::time::timeout(Duration::from_secs(5), ...) で MessageDelta { run_id: Some(id) } と AgentRunStateChanged { to: Waiting } を待機。高負荷時に timeout またはイベント順序で fail する可能性がある"
    - "runtime_sink.rs:170-197 chat_runs キャッシュを持ち、2 回目の chat は runtime.send_message(run_id, ...) を試行。失敗すると delegate_background で新規 run を起動。2 回目が同じ run_id になることを保証するには 1 回目の run が Waiting 状態で生存している必要がある"
    - "PR #84 の demo_loop flake fix 同様、決定論化には sleep/poll 依存の撤廃と event 待機ベースの milestone 検出が必要"
  intent_references:
    - intents/evorch/features/gui-workbench/overview.md
    - intents/evorch/features/agent-runtime-kernel/overview.md
  acceptance_criteria:
    - "高負荷再現（taskset -c 0,1 等）を 10 回以上実行し、失敗条件と根本原因（timeout / event 順序 / run 状態遷移の race）を特定した調査記録がある"
    - "根本原因が決定論化されている（sleep / poll interval 依存の撤廃、event 待機ベースの milestone 検出等）。PR #84 事例に準拠した修正方針をコードコメントで説明"
    - "taskset -c 0,1 相当の負荷下で該当テストが連続 N≥30 回 pass することを確認する記録（コマンドと結果）がある"
    - "既存テストの回帰がなく、cargo test --workspace が pass する"
    - "cargo test / cargo clippy --workspace --all-targets -- -D warnings / cargo fmt --check / git diff --check が pass する"
  intent_placement:
    primary_intent: intents/evorch/features/gui-workbench/overview.md
    supporting_intents:
      - intents/evorch/features/agent-runtime-kernel/overview.md
    new_intent_needed: false
    placement_rationale: "chat_sink_runtime は GUI 経由の chat run 駆動テストであり root cause は runtime の run 状態管理。決定論化の確定方式を gui-workbench overview に反映し、run 状態復帰の知見を agent-runtime-kernel overview へ writeback する。新規 intent は不要"
  knowledge_updates:
    intent_tree:
      required: true
      target_paths:
        - intents/evorch/features/gui-workbench/overview.md
      summary: "chat_sink_runtime flake の根本原因と決定論化の確定方式（sleep 撤廃 / event 待機ベース化 / run 状態復帰の保証）を実装確定として反映する"
    adr:
      required: false
      target_paths: []
      decision_title: ""
    diagram:
      required: false
      target_paths: []
      diagram_type: none
    docs:
      required: false
      target_paths: []
      summary: ""
  closeout_learning:
    expected: "flake の再現条件、timeout 値の妥当性、event 待機 primitive の使い方、chat_runs キャッシュと run 状態復帰の整合性を gui-workbench overview に記録する"
    write_back_required: true
    write_back_targets:
      - intents/evorch/features/gui-workbench/overview.md
guide_reachability:
  no_role_facing_surface: true
  routes: []
