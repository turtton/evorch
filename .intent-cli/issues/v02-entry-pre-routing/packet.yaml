  adr:
    required: false
    target_paths: []
    decision_title: ""
  diagram:
    required: false
    target_paths: []
    diagram_type: none
  docs:
    required: false
    target_paths: []
    summary: ""
closeout_learning:
  expected: "entry での routing 判定が型付きポリシー + ローカルキーワード + 同モデル再分類で実装され、GUI から Coordinated のみ Orchestrator が起動することが検証されたこと"
  write_back_required: true
  write_back_targets:
    - intents/evorch/features/orchestration/overview.md
# G645: GUI entry（goal 投入）と runtime routing API の role-facing surface
