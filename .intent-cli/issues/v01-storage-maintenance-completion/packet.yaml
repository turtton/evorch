    target_paths: []
    summary: "既存storage-memory maintenance要件のcompletion。"
  adr:
    required: false
    target_paths: []
    decision_title: "ADR 0012がincremental vacuum/temp検査を既決。具体値はoverviewへ実装記録する。"
  diagram:
    required: false
    target_paths: []
    diagram_type: none
  docs:
    required: true
    target_paths:
      - intents/evorch/features/storage-memory/overview.md
    summary: "vacuum trigger/page budget/temp thresholdとdiagnostic挙動を実装値として追記する。"
closeout_learning:
  expected: "実装したauto_vacuum互換方針、trigger、page budget、temp計測定義、diagnostic state transitionをstorage-memory overviewへwrite backする。"
  write_back_required: true
  write_back_targets:
    - intents/evorch/features/storage-memory/overview.md
