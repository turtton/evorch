implementation_issue_packet:
  issue_title: "v0.3: follow-up 整理（ReasoningDelta production emit / frame.rs legacy mirror 撤去 / agents グリッド列幅）"
  issue_kind: feature
  source_execution_unit: v03-followup-cleanups
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/runtime/ crates/gui/"
  target_part: "v0.3 進行中に蓄積した follow-up 3 件の整理: (a) ReasoningDelta の production emit 経路新設（runtime が Reasoning コンテンツを bus event 化）(b) crates/gui/src/app/frame.rs の run_id: None legacy mirror 撤去（PR #86 で縮小済みの残り）(c) agents グリッド列幅の自動フィット（horizontal scroll の代替）"
  dependencies: []
  technical_baseline:
    - "crates/runtime/src/agent_loop.rs: ContentBlock::Reasoning を処理する経路はあるが、Reasoning コンテンツが MessageEvent::ReasoningDelta として bus emit される production 経路は未完成（Text のみが MessageDelta 化されている）"
    - "crates/gui/src/app/frame.rs:51-52: MessageEvent::MessageDelta { run_id: None, .. } | ReasoningDelta { run_id: None, .. } の legacy match arm が残っている（run_id attribution 前の mirror、PR #86 で縮小済みの残り）"
    - "agents グリッド（crates/gui/src/panes/agent.rs 系）は列幅が固定で、内容に対し horizontal scroll が発生する"
  intent_references:
    - intents/evorch/features/agent-runtime-kernel/overview.md
    - intents/evorch/features/gui-workbench/overview.md
  acceptance_criteria:
    - "(a) runtime が Reasoning コンテンツを MessageEvent::ReasoningDelta として bus emit する production 経路があり、agent loop の streaming で GUI transcript に Reasoning 表示が到達する test がある"
    - "(b) crates/gui/src/app/frame.rs の run_id: None legacy mirror（MessageDelta / ReasoningDelta の catch-all arm）が撤去され、既存表示が run_id attribution 経路で維持される test がある"
    - "(c) agents グリッドの列幅が内容に自動フィットし、horizontal scroll が不要になる（または最小限化される）"
    - "3 件とも既存テストの回帰がなく、cargo test --workspace が pass する"
    - "cargo test / cargo clippy --workspace --all-targets -- -D warnings / cargo fmt --check / git diff --check が pass する"
  intent_placement:
