implementation_issue_packet:
  issue_title: "OTLP metrics exporter: 写像層経由の GenAI 標準 + evorch.* 拡張属性エクスポート"
  issue_kind: feature
  source_execution_unit: v02-otel-metrics-exporter
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/event-bus/"
  target_part: "写像層（crates/event-bus 内の新規 module。domain event → OTel 属性変換）+ metrics OTLP exporter（feature-gated opt-in、既定 off として新規導入）。crate 分割が必要になった場合は ADR 0016 の crate 粒度基準に従う"
  dependencies: []
  technical_baseline:
    - "ADR 0012 で計測アーキテクチャ（OTel Metrics API 語彙、raw 非永続、downsampled 保存、任意 OTLP export）が決定済みだが、opentelemetry crate 依存は未導入。本 slice で feature-gated opt-in（既定 off）として新規導入する"
    - "crates/event-bus に型付き event schema と tokio broadcast ベースの bus が landed 済み。provider 観測 event（request 開始 / response 完了 / usage 計測の観測点）は PR #32 で schema に追加済み"
    - "event bus の transport は in-process tokio broadcast に確定済み（ADR 0017）で、複数 subscriber への配信が可能"
    - "内部 event schema はドメイン語彙を保持し、OTel 属性への変換は専任写像層に集中させる（ADR 0023 決定 3）"
    - "gen_ai semconv は v1.37.0 に pin。自動追従せず意図的 bump のみ（ADR 0023 決定 6）"
  intent_references:
    - "intents/evorch/features/diagnostics-self-improvement/overview.md"
    - "intents/evorch/features/gui-workbench/overview.md"
    - "intents/evorch/technology/mvp-roadmap.md"
    - "intents/evorch/technology/architecture.md"
    - "intents/evorch/decisions/0012-metrics-architecture.md"
    - "intents/evorch/decisions/0014-config-architecture.md"
    - "intents/evorch/decisions/0015-verification-two-layer.md"
    - "intents/evorch/decisions/0017-event-bus-transport.md"
    - "intents/evorch/decisions/0023-otel-attribute-conventions.md"
  acceptance_criteria:
    - "写像層が内部ドメイン event を OTel 属性（gen_ai.* 標準 + evorch.* 拡張）へ一義的に変換し、属性 mapping 表が pin された semconv リリース（v1.37.0）を明記する"
    - "producer（provider / runtime / tool 各層）が opentelemetry crate を直接参照せず、OTel 変換が写像層 module に集中している"
    - "metrics attribute が whitelist（集計軸 session / task / agent_run / profile + 最小構造軸 evorch.delegation.depth / evorch.delegation.role の低カーディナリティ列挙値のみ）に収まり、ID 系属性・自由文字列が metric label に含まれない"
    - "検証が ADR 0023 決定 7 に従う: mapping 層の golden/snapshot test（pin 固定 fixture）＋ CI cardinality guard（metrics attribute whitelist 強制）＋ debug exporter 経由の最小 OTLP E2E が 1 本入る"
    - "`otel-exporter` feature が feature-gated opt-in（既定 off）として新規導入され、feature off（既定）ビルドで既存の event 配信・bus 動作が回帰しない"
    - "ADR 0023 確定版（決定 4 の evorch.* whitelist を最終属性で更新）と mvp-roadmap.md の v0.2「役割の深化と観測」への OTLP exporter（metrics）着手・完了の反映が本 slice に同梱される"

