implementation_issue_packet:
  issue_title: "OTLP span exporter: 委譲親子を span 親子に写像する GenAI 標準準拠エクスポート"
  issue_kind: feature
  source_execution_unit: v02-otel-span-exporter
  domain: evorch
  target_repo: turtton/evorch
  target_path: "crates/event-bus/"
  target_part: "写像層の span 化拡張 + span OTLP exporter"
  dependencies:
    - v02-otel-metrics-exporter
  technical_baseline:
    - "slice 1（v02-otel-metrics-exporter）完了が前提: `crates/event-bus/` 内に写像層（domain event → OTel 変換 module）と feature gate された OTLP metrics exporter が新規導入済みであること（opentelemetry crate 依存と feature gate 本体も slice 1 で導入される）"
    - "event bus の in-process broadcast transport は ADR 0017 で確定済み。内部 event schema は `crates/event-bus/` に存在し、PR #32 で provider 観測 event が landed 済み（task_id / agent_run_id による相関を含む）。schema はドメイン語彙を保持する（ADR 0023 決定 3）"
    - "委譲親子木の addressing は ADR 0022 で確立済み。span 親子写像の直接根拠とする"
    - "ADR 0012 の計測ポリシー（OTel Metrics API 採用、raw 非永続、ハード上限、sampling 方針）確定済み。feature gate の config 構成は ADR 0014 の枠組みに従い既定 off を維持。exporter 設定の reload は ADR 0019 の runtime reload 枠組みに従う"
    - "gen_ai semconv の pin は v1.37.0（ADR 0023 決定 6）。本 slice 着手時に bump を検討する（意図的 bump 手続き: release 差分精読 → 写像表差分 → 検証結果の明示表。自動追従しない）"
  intent_references:
    - "intents/evorch/features/diagnostics-self-improvement/overview.md"
    - "intents/evorch/features/gui-workbench/overview.md"
    - "intents/evorch/technology/mvp-roadmap.md"
    - "intents/evorch/technology/architecture.md"
    - "intents/evorch/decisions/0012-metrics-architecture.md"
    - "intents/evorch/decisions/0014-config-architecture.md"
    - "intents/evorch/decisions/0015-verification-two-layer.md"
    - "intents/evorch/decisions/0017-event-bus-transport.md"
    - "intents/evorch/decisions/0019-runtime-reload-semantics.md"
    - "intents/evorch/decisions/0022-parent-child-tree-addressing-and-nested-delegation.md"
    - "intents/evorch/decisions/0023-otel-attribute-conventions.md"
  acceptance_criteria:
    - "委譲親子が span 親子（parent span 紐付け）として写像される（task/run span → agent 実行 span → `invoke_agent` → child `chat` → `execute_tool` の階層）"
    - "span 命名・属性が OTel GenAI semconv（gen_ai.*）registry に準拠する（invoke_agent / chat / execute_tool 階層。pin 対象 semconv リリースは写像表に明記、現基準 v1.37.0）"
    - "evorch.* の span 属性に session / task / agent_run ID を保持する（metrics 側には載せない高カーディナリティ規律を維持）。構造軸は低カーディナリティ列挙（evorch.delegation.depth / evorch.delegation.role）に留める"
    - "raw の LLM I/O・SSE 本文・message 本文・credential を span 属性・span event として含めない（ADR 0012 の raw 非永続ポリシーと整合）"
    - "sampling hook と ADR 0012 のハード上限（件数/時間/byte 閾値）が span 経路にも実効する"
    - "slice 1 で導入された写像層の golden/snapshot test（pin 固定 fixture）を span 親子構造 fixture へ拡張し、CI cardinality guard（ID 混入の静的ブロック）が span 属性に対しても効くこと"
    - "debug exporter 経由の最小 OTLP E2E（span）が 1 本入り、wire レベル疎通を assertion できる"

