closeout_learning:
  expected: "mvp-roadmap.md の v0.2「役割の深化と観測」に OTLP exporter（span 側まで含む）の完了を反映する。ADR 0023 は確定済み前提とし、本 slice 実装中に semconv pin を bump した場合のみ ADR 0023 へ change-log 追記（「release 差分精読 → 写像表差分 → 検証結果」の明示表を残す）する。それ以外の ADR 更新は不要。"
  write_back_required: true
