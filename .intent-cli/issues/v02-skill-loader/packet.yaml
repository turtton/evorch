    summary: ""
closeout_learning:
  expected: "skill loader の実装確定（発見ディレクトリの既定配置、2 スコープ優先順位と shadowing の観測経路、progressive disclosure の注入点と token 目安、skill-load surface の形式（tool / meta op の最終選択）と role 付与、検証ルールとエラー観測経路、YAML 解析依存の選定結果）を agent-runtime-kernel overview に記録する"
  write_back_required: true
  write_back_targets:
    - intents/evorch/features/agent-runtime-kernel/overview.md
# G645: skill-load surface は agent が呼び出す role-facing surface を追加するため route form。
guide_reachability:
  no_role_facing_surface: false
  routes:
    - guide_surface: "agent-runtime-kernel overview で宣言される skill 利用 surface（skill-load）"
      role: Orchestrator
      target_surface: "run 開始時の skills metadata 露出と skill-load 呼び出し（meta op / tool 設定）"
    - guide_surface: "agent-runtime-kernel overview で宣言される skill 利用 surface（skill-load）"
      role: Worker
      target_surface: "実行中 agent からの skill-load 呼び出し（RoleCapabilities 許可対象）"
