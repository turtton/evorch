  new_intent_needed: false
  placement_rationale: "grill web-tools-v02 の確定を実装に落とす slice。Q1（web_search / web_fetch の 2 本分離）、Q2（builtin + keyless MCP transport）、Q3（Exa keyless 既定 + Tavily keyless 一次 fallback のみ）、Q6（ToolExecutor での ContentOrigin 機械導出）、Q7（3 層 AND + bwrap 外 main process 実行）、Q10（既存 ToolStarted/ToolCompleted + metadata detail）を tools-sandbox overview の v0.2 確定節に接続するため、新規 intent は不要"
