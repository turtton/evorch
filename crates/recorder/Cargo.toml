[package]
name = "recorder"
description = "Event and usage persistence bridge and usage pricing shared by the GUI and headless runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "recorder"

[dependencies]
catalog = { path = "../catalog" }
config = { path = "../config" }
event-bus = { path = "../event-bus" }
runtime = { path = "../runtime" }
secret-guard = { path = "../secret-guard" }
serde = { workspace = true }
serde_json = { workspace = true }
storage = { path = "../storage" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
