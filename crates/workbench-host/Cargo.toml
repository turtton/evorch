[package]
name = "workbench-host"
version.workspace = true
edition.workspace = true
publish = false
description = "Core-side command handling for the evorch workbench protocol (ADR 0045)."

# The core side of the workbench protocol: it owns the command services that the
# desktop GUI, the web adapter and the CLI all go through. It may depend on
# workbench-protocol and on core crates (runtime, storage, event-bus, ...), and
# must never reach a GUI or client crate. scripts/check-workbench-boundaries.sh
# enforces that in CI.
[dependencies]
workbench-protocol = { path = "../workbench-protocol" }
config = { path = "../config" }
event-bus = { path = "../event-bus" }
model = { path = "../model" }
providers = { path = "../providers" }
runtime = { path = "../runtime" }
tools = { path = "../tools" }
sandbox = { path = "../sandbox" }
serde_json = { workspace = true }
serde = { workspace = true }
secret-guard = { path = "../secret-guard" }
sha2 = { workspace = true }
storage = { path = "../storage" }
tokio = { workspace = true, features = ["sync", "rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

recorder = { path = "../recorder" }
routing = { path = "../routing" }
thiserror = { workspace = true }

[features]
# Test-only entry points for the in-process adapter's tests.
test-support = []

[dev-dependencies]
storage = { path = "../storage", features = ["test-support"] }
async-trait = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
