[package]
name = "workbench-host"
version.workspace = true
edition.workspace = true
publish = false
description = "Core-side command handling for the evorch workbench protocol (ADR 0045)."

# The core side of the workbench protocol: it owns the command services that the
# desktop GUI, the web adapter and the CLI all go through. It may depend on
# workbench-protocol and on core crates (runtime, storage, event-bus, ...), and
# must never reach a GUI or client crate. scripts/check-workbench-boundaries.sh
# enforces that in CI.
[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
rustix = { version = "1", features = ["fs"] }
image = { workspace = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }
workbench-protocol = { path = "../workbench-protocol" }
workspace-state = { path = "../workspace-state" }
config = { path = "../config" }
event-bus = { path = "../event-bus" }
eval = { path = "../eval" }
model = { path = "../model" }
providers = { path = "../providers" }
runtime = { path = "../runtime" }
# The renderer helper's IPC (free of CEF and of every core crate) and the agent
# browser's page types, for the artifact/browser areas' adapters (PR 16a-2).
# browser-cef must never be added here: the host links no CEF
# (scripts/check-workbench-boundaries.sh).
renderer-ipc = { path = "../renderer-ipc" }
browser = { path = "../browser" }
tools = { path = "../tools" }
sandbox = { path = "../sandbox", features = ["keychain"] }
catalog = { path = "../catalog" }
serde_json = { workspace = true }
serde = { workspace = true }
secret-guard = { path = "../secret-guard" }
sha2 = { workspace = true }
storage = { path = "../storage" }
tokio = { workspace = true, features = ["sync", "rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

recorder = { path = "../recorder" }
routing = { path = "../routing" }
thiserror = { workspace = true }

[features]
# Test-only entry points for the in-process adapter's tests.
test-support = ["runtime/recovery-test-support", "runtime/idle-test-support"]

[dev-dependencies]
# Integration tests of this crate use the test-support entry points (the
# observation gate), which the crate alone does not enable for its own tests.
workbench-host = { path = ".", features = ["test-support"] }
runtime = { path = "../runtime", features = ["recovery-test-support", "idle-test-support"] }
test-socket-dir = { path = "../test-socket-dir" }
storage = { path = "../storage", features = ["test-support"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
