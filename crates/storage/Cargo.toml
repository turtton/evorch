[package]
name = "storage"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "storage"

[dependencies]
secret-guard = { path = "../secret-guard" }
# Phase B revisions/counters are u64; out-of-range values fail instead of wrapping.
rusqlite = { workspace = true, features = ["fallible_uint", "functions", "pointer"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
event-bus = { path = "../event-bus" }

[dev-dependencies]
rusqlite = { workspace = true, features = ["hooks"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
