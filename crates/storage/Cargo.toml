[package]
name = "storage"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "storage"

[dependencies]
secret-guard = { path = "../secret-guard" }
# Phase B revisions/counters are u64; out-of-range values fail instead of wrapping.
rusqlite = { workspace = true, features = ["fallible_uint", "functions", "pointer"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
zstd = "0.13"
event-bus = { path = "../event-bus" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# Contract tests serialize canonical provider messages so the JSON shape storage keys on cannot drift.
providers = { path = "../providers" }
rusqlite = { workspace = true, features = ["hooks"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
