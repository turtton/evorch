[package]
name = "gui"
description = "egui + egui_dock workbench GUI for evorch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "gui"

[dependencies]
arena = { path = "../arena" }
ashpd = { workspace = true }
async-trait = { workspace = true }
catalog = { path = "../catalog" }
config = { path = "../config" }
eframe = { workspace = true }
egui = { workspace = true }
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"] }
egui_dock = { workspace = true }
egui_kittest = { workspace = true }
event-bus = { path = "../event-bus" }
image = { workspace = true, default-features = false, features = ["png"] }
model = { path = "../model" }
portable-pty = { workspace = true }
providers = { path = "../providers" }
routing = { path = "../routing" }
runtime = { path = "../runtime" }
sandbox = { path = "../sandbox", features = ["keychain"] }
serde = { workspace = true }
storage = { path = "../storage" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
workspace-ui = { path = "../workspace-ui" }

[dev-dependencies]
mock-openai = { path = "../mock-openai" }
tools = { path = "../tools" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
