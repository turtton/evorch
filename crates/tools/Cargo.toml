[package]
name = "tools"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "tools"

[[bin]]
name = "lsp-test-server"
path = "tests/support/lsp_server.rs"

[[bin]]
name = "comment-checker-test-fixture"
path = "tests/support/comment_checker.rs"
test = false
bench = false

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
browser = { path = "../browser" }
config = { path = "../config" }
dom_smoothie = { workspace = true }
event-bus = { path = "../event-bus" }
flate2 = { workspace = true }
hickory-resolver = { workspace = true }
htmd = { workspace = true }
image = { workspace = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ipnet = { workspace = true }
jsonschema = { workspace = true }
portable-pty = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
sandbox = { path = "../sandbox" }
secret-guard = { path = "../secret-guard" }
rustix = { version = "1", features = ["process", "fs"] }
uuid = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "rt", "time"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# Normal-exit cleanup for process-wide unit-test shell handle state.
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tokio-rustls = { workspace = true }
