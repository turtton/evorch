[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "sandbox"

[features]
keychain = ["dep:keyring"]

[dependencies]
event-bus = { path = "../event-bus" }
keyring = { workspace = true, optional = true }
rustix = { version = "1", features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "time"] }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# close_range(2), which rustix 1 does not wrap, for the child launch policy.
libc = "0.2"

[dev-dependencies]
# The launch policy tests run themselves on a pseudo-terminal.
portable-pty = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
