[package]
name = "evorch-core"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "core-mcp-test-peer"
path = "tests/support/mcp_peer.rs"
test = false
bench = false

[dependencies]
core-instance = { path = "../core-instance" }
workbench-host = { path = "../workbench-host" }
workbench-protocol = { path = "../workbench-protocol" }
workbench-web = { path = "../workbench-web" }
config = { path = "../config" }
event-bus = { path = "../event-bus" }
runtime = { path = "../runtime" }
storage = { path = "../storage" }
secret-guard = { path = "../secret-guard" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
uuid = { workspace = true }
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
test-socket-dir = { path = "../test-socket-dir" }
model = { path = "../model" }
runtime = { path = "../runtime", features = ["recovery-test-support"] }
rusqlite = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
mock-openai = { path = "../mock-openai" }
workbench-host = { path = "../workbench-host", features = ["test-support"] }
providers = { path = "../providers" }
async-trait = { workspace = true }
test-support = { path = "../test-support" }
sandbox = { path = "../sandbox" }
tools = { path = "../tools" }
routing = { path = "../routing" }
recorder = { path = "../recorder" }
workspace-state = { path = "../workspace-state" }
reqwest = { workspace = true }
workbench-client = { path = "../workbench-client" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "process"] }
