[package]
name = "evorch-core"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "core-mcp-test-peer"
path = "tests/support/mcp_peer.rs"
test = false
bench = false

[features]
bootstrap-test-support = ["core-instance/recovery-test-support", "storage/recovery-test-support", "workbench-web/test-support"]
# Builds the fake renderer helper the owned-spawn tests start (PR 16a-2). Off by
# default and never part of a product build; the cache gate does not need it.
renderer-test-helper = ["dep:renderer-ipc"]

[[bin]]
name = "evorch-renderer-test-helper"
path = "tests/support/renderer_test_helper.rs"
required-features = ["renderer-test-helper"]
test = false
bench = false

[[bin]]
name = "core-bootstrap-harness"
path = "harness/bootstrap.rs"
required-features = ["bootstrap-test-support"]
test = false
bench = false

[[test]]
name = "planned_shutdown_watchdog_composition"
path = "tests/planned_shutdown_watchdog_composition/main.rs"
harness = false
required-features = ["bootstrap-test-support"]

[[test]]
name = "recovery_admin_install"
path = "tests/recovery_admin_install/main.rs"

[[test]]
name = "recovery_admission"
path = "tests/recovery_admission.rs"

[[test]]
name = "public_restart_compose"
path = "tests/public_restart_compose/main.rs"

[[test]]
name = "public_restart_exec"
path = "tests/public_restart_exec.rs"

[[test]]
name = "public_restart_deny"
path = "tests/public_restart_deny.rs"

[[test]]
name = "public_restart_safe"
path = "tests/public_restart_safe.rs"

[[test]]
name = "public_restart_product"
path = "tests/public_restart_product.rs"

[dependencies]
sandbox = { path = "../sandbox" }
workbench-authority = { path = "../workbench-authority" }
core-instance = { path = "../core-instance" }
core-launcher = { path = "../core-launcher" }
sha2 = { workspace = true }
workbench-host = { path = "../workbench-host" }
workbench-protocol = { path = "../workbench-protocol" }
workbench-web = { path = "../workbench-web" }
config = { path = "../config" }
renderer-ipc = { path = "../renderer-ipc", optional = true }
event-bus = { path = "../event-bus" }
runtime = { path = "../runtime" }
storage = { path = "../storage" }
secret-guard = { path = "../secret-guard" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
uuid = { workspace = true }
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
libc = "0.2"
test-socket-dir = { path = "../test-socket-dir" }
model = { path = "../model" }
storage = { path = "../storage", features = ["test-support"] }
runtime = { path = "../runtime", features = ["recovery-test-support", "idle-test-support"] }
rusqlite = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
mock-openai = { path = "../mock-openai" }
workbench-host = { path = "../workbench-host", features = ["test-support"] }
providers = { path = "../providers" }
async-trait = { workspace = true }
test-support = { path = "../test-support" }
tools = { path = "../tools" }
routing = { path = "../routing" }
recorder = { path = "../recorder" }
workspace-state = { path = "../workspace-state" }
reqwest = { workspace = true }
workbench-client = { path = "../workbench-client" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "process", "io-std"] }
