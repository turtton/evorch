[package]
name = "runtime"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "runtime"

[dependencies]
agents = { path = "../agents" }
async-trait = { workspace = true }
base64 = { workspace = true }
browser = { path = "../browser" }
catalog = { path = "../catalog" }
config = { path = "../config" }
# Reuse lol_html's tokenizer version rather than adding another CSS parser.
cssparser = "0.36"
event-bus = { path = "../event-bus" }
futures-util = { workspace = true }
globset = { workspace = true }
# run ID や質問 ID などのランダムな識別子の生成に使用する。
getrandom = { workspace = true }
lol_html = { workspace = true }
# WHATWG character-reference table, already used by the HTML dependencies.
markup5ever = "0.39"
model = { path = "../model" }
providers = { path = "../providers" }
regex = { workspace = true }
routing = { path = "../routing" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sandbox = { path = "../sandbox" }
secret-guard = { path = "../secret-guard" }
sha2 = { workspace = true }
storage = { path = "../storage" }
thiserror = { workspace = true }
tools = { path = "../tools" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
socket2 = "0.6"

[dev-dependencies]
test-support = { path = "../test-support" }
url = { workspace = true }
jsonschema = { workspace = true }
wiremock = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
tokio-rustls = { workspace = true }
mock-openai = { path = "../mock-openai" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
