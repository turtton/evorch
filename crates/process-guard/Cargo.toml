[package]
name = "process-guard"
version.workspace = true
edition.workspace = true
publish = false

# Exact versions are the package-local dependency receipt hashed by build.rs.
# Updating any helper dependency requires a new compat identity.
[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[build-dependencies]
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = { workspace = true }
portable-pty = { workspace = true }

[[bin]]
name = "evorch-process-guard"
path = "src/main.rs"
