[package]
name = "providers"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "providers"

[dependencies]
apply-patch = { path = "../apply-patch" }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
config = { path = "../config" }
event-bus = { path = "../event-bus" }
futures-core = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
image = { workspace = true }
reqwest = { workspace = true }
secret-guard = { path = "../secret-guard" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
xxhash-rust = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "time", "process", "io-util"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
webpki-root-certs = "1"
wreq = { version = "=0.16.1", default-features = false, features = ["tokio-rt", "webpki-roots", "system-proxy", "json", "query", "stream", "gzip", "brotli", "deflate", "zstd"] }

[dev-dependencies]
mock-openai = { path = "../mock-openai" }
rcgen = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
tokio-rustls = { workspace = true, features = ["ring"] }
wiremock = { workspace = true }
