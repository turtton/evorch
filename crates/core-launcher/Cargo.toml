[package]
name = "core-launcher"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "core-launch-harness"
path = "harness/main.rs"

[features]
default = []
handoff-test-support = []

[[bin]]
name = "core-handoff-fixture"
path = "harness/handoff.rs"
required-features = ["handoff-test-support"]

[dependencies]
libc = "0.2"
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
uuid.workspace = true
core-instance = { path = "../core-instance" }
workbench-client = { path = "../workbench-client" }
workbench-protocol = { path = "../workbench-protocol" }
rustix = { version = "1", features = ["process"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "rt", "net", "io-util", "macros"] }

[dev-dependencies]
test-socket-dir = { path = "../test-socket-dir" }
rustix = { version = "1", features = ["event"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "process", "test-util"] }
