[package]
name = "core-client-e2e"
version.workspace = true
edition.workspace = true
publish = false

# The mock MCP server of the screen test: the same native peer the core's own
# tests use, built here so that this package's tests can start it
# (CARGO_BIN_EXE_e2e-mcp-peer).
[[bin]]
name = "e2e-mcp-peer"
path = "../evorch-core/tests/support/mcp_peer.rs"
test = false
bench = false

[[test]]
name = "public_restart_native"
path = "tests/public_restart_native.rs"

[[test]]
name = "default_gui_cache"
path = "tests/default_gui_cache.rs"

[dependencies]
serde_json = { workspace = true }

# A test-only composition root keeps rendering out of the core and Web adapter.
[dev-dependencies]
test-socket-dir = { path = "../test-socket-dir" }
test-support = { path = "../test-support" }
gui = { path = "../gui", default-features = false }
evorch-core = { path = "../evorch-core" }
core-instance = { path = "../core-instance" }
core-launcher = { path = "../core-launcher" }
workbench-protocol = { path = "../workbench-protocol" }
workbench-client = { path = "../workbench-client" }
evorch = { path = "../evorch" }
workbench-host = { path = "../workbench-host", features = ["test-support"] }
egui_kittest = { workspace = true }
workspace-state = { path = "../workspace-state" }
workbench-web = { path = "../workbench-web" }
runtime = { path = "../runtime" }
event-bus = { path = "../event-bus" }
providers = { path = "../providers" }
tools = { path = "../tools" }
storage = { path = "../storage" }
recorder = { path = "../recorder" }
sandbox = { path = "../sandbox" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "io-util", "time"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
mock-openai = { path = "../mock-openai" }
config = { path = "../config" }
routing = { path = "../routing" }
egui = { workspace = true }
egui-wgpu = "0.36"
base64 = { workspace = true }
image = { workspace = true }
